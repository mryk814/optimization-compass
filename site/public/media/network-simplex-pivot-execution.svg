<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1039" width="440" height="1039" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Network Simplexの1回のpivotで輸送の流れが変わる様子</title><desc id="figure-description">供給ノードAとBから需要ノードX、Y、Zへ9単位を輸送する固定した最小費用流。初期の全域木へAからZの辺を加える。できた閉路に1単位を流すとAからYの辺が木を離れる。全ノードの需給を保ったまま総費用が20から18へ下がる。</desc><rect width="440" height="1039" rx="16" fill="#f7f6f1"/><text x="20" y="34" class="title">1本加えると、閉路が1つできる</text><text x="20" y="59" class="subtitle">固定した輸送問題の流れ・</text><text x="20" y="80" class="subtitle">全域木のpivot 1回・整数の供給量</text><defs><marker id="ns-arrow-muted" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#aebbb6"/></marker><marker id="ns-arrow-tree" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#102a2e"/></marker><marker id="ns-arrow-active" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#2c7564"/></marker><marker id="ns-arrow-enter" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#d67835"/></marker></defs><text x="20" y="111" class="note">辺のラベルは 流量 × 単位費用。</text><text x="20" y="132" class="note">左の数は供給量、右の数は需要量です。</text><rect x="20" y="155" width="400" height="346" rx="12" fill="#fff" stroke="#d6ddd7"/><text x="34" y="183" class="panel-title">前: 実行可能な全域木</text><text x="406" y="189" text-anchor="end" class="metric-value" style="fill:#2c7564">総費用 20</text><text x="34" y="211" class="status" style="fill:#8b4c3d">橙の破線: 入る辺 A → Z（被約費用 -2）</text><line x1="98" y1="291.00" x2="342" y2="255.00" stroke="#dfe7e3" stroke-width="1.5"/><line x1="98" y1="291.00" x2="342" y2="255.00" stroke="#102a2e" stroke-width="5.60" stroke-linecap="round" marker-end="url(#ns-arrow-tree)"/><line x1="98" y1="291.00" x2="342" y2="351.00" stroke="#dfe7e3" stroke-width="1.5"/><line x1="98" y1="291.00" x2="342" y2="351.00" st