 x="220.00" y="802.00" text-anchor="middle" class="metric-value halo">3 × 2</text><circle cx="76" cy="649.00" r="20" fill="#d67835"/><text x="76" y="655.00" text-anchor="middle" class="panel-title" style="fill:#fff">A</text><text x="32" y="654.00" class="metric-value">+4</text><circle cx="76" cy="769.00" r="20" fill="#d67835"/><text x="76" y="775.00" text-anchor="middle" class="panel-title" style="fill:#fff">B</text><text x="32" y="774.00" class="metric-value">+5</text><circle cx="364" cy="613.00" r="20" fill="#2c7564"/><text x="364" y="619.00" text-anchor="middle" class="panel-title" style="fill:#fff">X</text><text x="390" y="618.00" class="metric-value">−3</text><circle cx="364" cy="709.00" r="20" fill="#2c7564"/><text x="364" y="715.00" text-anchor="middle" class="panel-title" style="fill:#fff">Y</text><text x="390" y="714.00" class="metric-value">−2</text><circle cx="364" cy="805.00" r="20" fill="#2c7564"/><text x="364" y="811.00" text-anchor="middle" class="panel-title" style="fill:#fff">Z</text><text x="390" y="810.00" class="metric-value">−4</text><text x="20" y="893" class="metric">pivot</text><text x="420" y="893" text-anchor="end" class="metric-value">A → Z が入り、A → Y が出る</text><text x="20" y="919" class="metric">総費用の変化</text><text x="420" y="919" text-anchor="end" class="metric-value">20 → 18</text><text x="20" y="953" class="caption">実行生成: scripts.generate_article_figures.</text><text x="20" y="974" class="caption">_network_simplex_transport_probe · dataset 0.18.20</text><text x="20" y="999" class="caveat">供給2点と需要3点の固定教材です。退化、</text><text x="20" y="1020" class="caveat">容量の上限、大規模なnetworkでの性能は示しません。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value{font-weight:750}.status,.axis,.