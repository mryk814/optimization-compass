<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">backward passのgainがforward rolloutを変える</title><desc id="figure-description">記事のPython例と同じ2 state、1 control、40 stepの有限horizon linear LQR部分問題をpure Pythonで実行した結果です。backward passで時刻別feedback gainを求め、初期state [2, 0]からforward rolloutします。stateとcontrolの履歴、terminal state、maximum controlを示します。非線形iLQR/DDP反復、regularization、line search、一般制約、実時間性能は含みません。</desc><rect width="640" height="1080" rx="24" fill="#f7f6f1"/><text x="32" y="50" class="lqr-title">backward passのgainがforward rolloutを変える</text><text x="32" y="82" class="lqr-subtitle">2 state · 1 control · horizon 40 · dt 0.1 · target [0, 0]</text><text x="32" y="128" class="lqr-section">terminal costから時刻別gainへ</text><rect x="24" y="150" width="592" height="118" rx="18" fill="#fff" stroke="#cfd8d1"/><text x="48" y="183" class="lqr-small-label">backward</text><text x="48" y="218" class="lqr-gain">K₃₉</text><text x="48" y="246" class="lqr-gain-value">[0.000, 5.000]</text><text x="201" y="225" class="lqr-arrow">→</text><text x="251" y="218" class="lqr-gain">K₂₀</text><text x="251" y="246" class="lqr-gain-value">[7.604, 4.978]</text><text x="404" y="225" class="lqr-arrow">→</text><text x="454" y="218" class="lqr-gain">K₀</text><text x="454" y="246" class="lqr-gain-value">[7.604, 4.978]</text><text x="32" y="302" class="lqr-section">forward rolloutのstate</text><rect x="68.0" y="318.0" width="536.0" height="285.0" rx="14" fill="#fff" stroke="#cfd8d1"/><line x1="68.0" y1="556.47" x2="604.0" y2="556.47" stroke="#ebe8e0"/><text x="58.0" y="562.47" text-anchor="end" class="lqr-axis">-2</text><line x1="68.0" y1="498.31" x2="604.0" y2="498.31" stroke="#ebe8e0"/><text x="58.0" y="504.31" text-anchor="end" class="lqr-axis">-1</text><line x1="68.0" y1="440.14" x2="604.0" y2="440.14" stroke="#ebe8e0"/><text x="58.0" y="446.14" text-anchor="end" class="lqr-axis">0</text><line x1="68.0" y1="381.98" x