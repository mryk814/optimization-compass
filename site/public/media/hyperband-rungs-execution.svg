<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 709" width="440" height="709" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Successive Halvingの資源配分</title><desc id="figure-description">12試行を資源1で評価して4試行、さらに1試行へ絞る固定実行。</desc><rect width="440" height="709" rx="16" fill="#f7f6f1"/><text x="20" y="34" class="title">全試行を最後まで育てない</text><text x="20" y="59" class="subtitle">Successive Halving・</text><text x="20" y="80" class="subtitle">12 → 4 → 1試行・資源 1 → 3 → 9</text><rect x="20" y="105" width="400" height="352" rx="12" fill="#fff" stroke="#d6ddd7"/><text x="34" y="133" class="panel-title">試行ごとの指標と昇格</text><line x1="70" y1="157" x2="70" y2="419" stroke="#dfe5e0" stroke-width="2"/><text x="70" y="441" text-anchor="middle" class="axis">資源 1</text><line x1="220" y1="157" x2="220" y2="419" stroke="#dfe5e0" stroke-width="2"/><text x="220" y="441" text-anchor="middle" class="axis">資源 3</text><line x1="370" y1="157" x2="370" y2="419" stroke="#dfe5e0" stroke-width="2"/><text x="370" y="441" text-anchor="middle" class="axis">資源 9</text><polyline points="70,341.69 220,361.80" fill="none" stroke="#367e61" stroke-width="2"/><circle cx="70" cy="341.69" r="3.5" fill="#367e61"/><circle cx="220" cy="361.80" r="3.5" fill="#367e61"/><polyline points="70,338.05 220,373.30 370,407.00" fill="none" stroke="#dc6b3f" stroke-width="3.5"/><circle cx="70" cy="338.05" r="3.5" fill="#dc6b3f"/><circle cx="220" cy="373.30" r="3.5" fill="#dc6b3f"/><circle cx="370" cy="407.00" r="3.5" fill="#dc6b3f"/><polyline points="70,326.45 220,340.92" fill="none" stroke="#367e61" stroke-width="2"/><circle cx="70" cy="326.45" r="3.5" fill="#367e61"/><circle cx="220" cy="340.92" r="3.5" fill="#367e61"/><polyline points="70,300.50 220,310.30" fill="none" stroke="#367e61" stroke-width="2"/><circle cx="70" cy="300.50" r="3.5" fill="#367e61"/><circle cx="220" cy="310.30" r="3.5" fill="#367e61"/><polyline points="70,286.21" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="286.21" r="3.5" fill="#b8beb9"/><polyline points="70,272.57" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="272.57" r="3.5" fill="#b8beb9"/><polyline points="70,257.80" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="257.80" r="3.5" fill="#b8beb9"/><polyline points="70,228.27" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="228.27" r="3.5" fill="#b8beb9"/><polyline points="70,218.07" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="218.07" r="3.5" fill="#b8beb9"/><polyline points="70,206.96" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="206.96" r="3.5" fill="#b8beb9"/><polyline points="70,187.44" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="187.44" r="3.5" fill="#b8beb9"/><polyline points="70,171.00" fill="none" stroke="#b8beb9" stroke-width="2"/><circle cx="70" cy="171.00" r="3.5" fill="#b8beb9"/><text x="20" y="491" class="metric">消費した資源</text><text x="420" y="491" text-anchor="end" class="metric-value">26 / 108</text><text x="20" y="513" class="status">分母は全試行を資源9まで進めた場合</text><text x="20" y="543" class="metric">この固定例で省いた資源</text><text x="420" y="543" text-anchor="end" class="metric-value">76%</text><text x="20" y="577" class="note">灰色は資源1、緑は資源3、橙は資源9まで進んだ試行。</text><text x="20" y="598" class="note">割り当ての判断だけを描いています。</text><text x="20" y="623" class="caption">実行生成: scripts/generate_article_figures.py::</text><text x="20" y="644" class="caption">_hyperband_rungs_probe · dataset 0.18.19</text><text x="20" y="669" class="caveat">固定した滑らかな学習曲線です。遅咲きの試行、</text><text x="20" y="690" class="caveat">ノイズ、非同期の待ちは省略しています。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value