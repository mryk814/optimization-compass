<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">同じ12 scenarioでも、riskの置き方で配分が変わる</title><desc id="figure-description">4資産の配分を、同じtraining 8件とheld-out 4件で評価した固定教材です。nominal目的とCVaRを含む目的について、配分とmean loss、CVaR 75%、worst lossをtrainingとheld-outに分けて示します。</desc><rect width="800" height="920" rx="24" fill="#f7f6f1"/><text x="42" y="54" class="title">同じsampleでも、riskの置き方で配分が変わる</text><text x="42" y="84" class="subtitle">4 assets · training 8 + held-out 4 · same capped simplex · α = 0.75</text><rect x="42" y="116" width="716" height="316" rx="16" fill="#fff" stroke="#cfd8d1"/><text x="64" y="154" class="panel-title" fill="#245c42">nominal目的</text><text x="736" y="154" text-anchor="end" class="status">training mean loss</text><text x="64" y="188" class="metric">配分</text><rect x="126.00" y="168.00" width="274.50" height="34.0" fill="#245c42"/><text x="126" y="228" class="status"><tspan fill="#245c42" font-weight="750">●</tspan> Asset 1: 0.45</text><text x="276" y="228" class="status"><tspan fill="#c56b32" font-weight="750">●</tspan> Asset 2: 0.00</text><text x="426" y="228" class="status"><tspan fill="#456b92" font-weight="750">●</tspan> Asset 3: 0.00</text><rect x="400.50" y="168.00" width="335.50" height="34.0" fill="#8b7d58"/><text x="576" y="228" class="status"><tspan fill="#8b7d58" font-weight="750">●</tspan> Asset 4: 0.55</text><text x="64" y="274" class="method">評価split</text><text x="310" y="274" class="method">mean loss</text><text x="494" y="274" class="method">CVaR 75%</text><text x="668" y="274" class="method">worst loss</text><text x="64" y="318" class="metric">training 8</text><text x="310" y="318" class="metric-value">-0.00875</text><text x="494" y="318" class="metric-value">0.01775</text><text x="668" y="318" class="metric-value">0.0215</text><text x="64" y="372" class="metric">held-out 4</text><text x="310" y="372" class="metric-value">-0.001625</text><text x="494" y="372" class="metric-value">0.018</text><text x="668" y="372" class="metric-value">0.018</text><line x1="64" y1="410" x2="736" y2="410" stroke="#245c42" stroke-width="3"/><rect x="42" y="460" width="716" height="316" rx="16" fill="#fff" stroke="#cfd8d1"/><text x="64" y="498" class="panel-title" fill="#c56b32">CVaRを含む目的</text><text x="736" y="498" text-anchor="end" class="status">training mean loss + 0.5 CVaR_0.75</text><text x="64" y="532" class="metric">配分</text><rect x="126.00" y="512.00" width="183.00" height="34.0" fill="#245c42"/><text x="126" y="572" class="status"><tspan fill="#245c42" font-weight="750">●</tspan> Asset 1: 0.30</text><rect x="309.00" y="512.00" width="244.00" height="34.0" fill="#c56b32"/><text x="276" y="572" class="status"><tspan fill="#c56b32" font-weight="750">●</tspan> Asset 2: 0.40</text><text x="426" y="572" class="status"><tspan fill="#456b92" font-weight="750">●</tspan> Asset 3: 0.00</text><rect x="553.00" y="512.00" width="183.00" height="34.0" fill="#8b7d58"/><text x="576" y="572" class="status"><tspan fill="#8b7d58" font-weight="750">●</tspan> Asset 4: 0.30</text><text x="64" y="618" class="method">評価split</text><text x="310" y="618" class="method">mean loss</text><text x="494" y="618" class="method">CVaR 75%</text><text x="668" y="618" class="method">worst loss</text><text x="64" y="662" class="metric">training 8</text><text x="310" y="662" class="metric-value">-0.00875</text><text x="494" y="662" class="metric-value">0.0065</text><text x="668" y="662" class="metric-value">0.01</text><text x="64" y="716" class="metric">held-out 4</text><text x="310" y="716" class="metric-value">-0.00475</text><text x="494" y="716" class="metric-value">0.007</text><text x="668" y="716" class="metric-value">0.007</text><line x1="64" y1="754" x2="736" y2="754" stroke="#c56b32" stroke-width="3"/><text x="42" y="826" class="caption">実行生成: optimization_compass.portfolio_uncertainty.generate_portfolio_uncertainty_traces · dataset 0.18.19</text><text x="42" y="860" class="caveat">固定8/4 scenarioのempirical summaryであり、母集団riskや将来returnを保証しません。</text><text x="42" y="892" class="note">lossは小さい側が良い。trainingとheld-outは別々に読みます。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d}.title{font-size:28px;font-weight:750}.subtitle{font-size:16px;fill:#617068}.panel-title,.method{font-size:19px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value{font-weight:750}.status,.axis,.note{font-size:14px;fill:#617068}.caption{font-size:15px;fill:#46554d}.caveat{font-size:14px;fill:#7a4b38}</style></svg>
