ass="metric">評価用 4件</text><text x="234" y="342" text-anchor="end" class="metric-value">-0.001625</text><text x="320" y="342" text-anchor="end" class="metric-value">0.018</text><text x="406" y="342" text-anchor="end" class="metric-value">0.018</text><rect x="20" y="376" width="400" height="257" rx="12" fill="#fff" stroke="#cfd8d1"/><rect x="20" y="388" width="4" height="26" fill="#c56b32"/><text x="34" y="406" class="panel-title" style="fill:#c56b32">CVaRを含む目的</text><text x="34" y="428" class="status">学習用データの平均損失 + 0.5·CVaR 75%</text><text x="34" y="493" class="metric">配分</text><rect x="34.00" y="445.00" width="111.60" height="26.0" fill="#245c42"/><text x="82" y="493" class="status"><tspan fill="#245c42" font-weight="750">●</tspan> 資産1: 0.30</text><rect x="145.60" y="445.00" width="148.80" height="26.0" fill="#c56b32"/><text x="252" y="493" class="status"><tspan fill="#c56b32" font-weight="750">●</tspan> 資産2: 0.40</text><text x="82" y="515" class="status"><tspan fill="#456b92" font-weight="750">●</tspan> 資産3: 0.00</text><rect x="294.40" y="445.00" width="111.60" height="26.0" fill="#8b7d58"/><text x="252" y="515" class="status"><tspan fill="#8b7d58" font-weight="750">●</tspan> 資産4: 0.30</text><text x="34" y="555" class="method">データ</text><text x="234" y="555" text-anchor="end" class="method">平均損失</text><text x="320" y="555" text-anchor="end" class="method">CVaR 75%</text><text x="406" y="555" text-anchor="end" class="method">最悪損失</text><text x="34" y="585" class="metric">学習用 8件</text><text x="234" y="585" text-anchor="end" class="metric-value">-0.00875</text><text x="320" y="585" text-anchor="end" class="metric-value">0.0065</text><text x="406" y="585" text-anchor="end" class="metric-value">0.01</text><text x="34" y="613" class="metric">評価用 4件</text><text x="234" y="613" text-anchor="end" class="metric-value">-0.00475</text><text x="320" y="613" text-anchor="end" class="metric-value">0.007</text><text x="406" y="613" text-anchor="end" class="metric-value">0.007</text><text x="20" y="661" class="note">損失は小さいほど良い。</text><text x="20" y="682" class="note">学習用データと評価用データは別々に読みます。</text><text x="20" y="707" class="caption">実行生成: optimization_compass.</text><text x="20" y="728" class="caption">portfolio_uncertainty.</text><text x="20" y="749" class="caption">generate_portfolio_uncertainty_traces ·</text><text x="20" y="770" class="caption">dataset 0.18.23</text><text x="20" y="795" class="caveat">固定した8件と4件のシナリオの経験的な要約です。</text><text x="20" y="816" class="caveat">母集団のリスクや将来のリターンは保証しません。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value{font-weight:750}.status,.axis,.note{fill:#617068}.caption{fill:#46554d}.caveat{fill:#7a4b38}.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></svg>
