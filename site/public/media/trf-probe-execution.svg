<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 647" width="440" height="647" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">同じ診断probeでも、初期値で残差の履歴が変わる</title><desc id="figure-description">20観測の指数減衰fitに対する、solverに依存しないdamped Gauss–Newton診断probeの実行結果です。通常の初期値と悪い初期値について、評価12回までの残差ノルムを対数目盛で示します。TRF本体の実行ではありません。</desc><rect width="440" height="647" rx="16" fill="#f7f6f1"/><text x="20" y="34" class="title">同じ診断probeでも、</text><text x="20" y="59" class="title">初期値で残差の履歴が変わる</text><text x="20" y="84" class="subtitle">指数減衰のfit・観測20点・評価12回</text><text x="20" y="107" class="axis">縦軸: 残差ノルム（対数目盛）</text><rect x="46" y="122" width="374" height="250" rx="12" fill="#fff" stroke="#cfd8d1"/><clipPath id="trf-plot"><rect x="46" y="122" width="374" height="250" rx="12"/></clipPath><line x1="46" y1="136.70" x2="420" y2="136.70" stroke="#e2e7e2"/><text x="40" y="141.70" text-anchor="end" class="axis">3</text><line x1="46" y1="192.83" x2="420" y2="192.83" stroke="#e2e7e2"/><text x="40" y="197.83" text-anchor="end" class="axis">1</text><line x1="46" y1="254.35" x2="420" y2="254.35" stroke="#e2e7e2"/><text x="40" y="259.35" text-anchor="end" class="axis">0.3</text><line x1="46" y1="310.48" x2="420" y2="310.48" stroke="#e2e7e2"/><text x="40" y="315.48" text-anchor="end" class="axis">0.1</text><line x1="46" y1="372.00" x2="420" y2="372.00" stroke="#e2e7e2"/><text x="40" y="377.00" text-anchor="end" class="axis">0.03</text><line x1="54.00" y1="122" x2="54.00" y2="372" stroke="#eef1ee"/><text x="54.00" y="392" text-anchor="middle" class="axis">1</text><line x1="151.64" y1="122" x2="151.64" y2="372" stroke="#eef1ee"/><text x="151.64" y="392" text-anchor="middle" class="axis">4</text><line x1="281.82" y1="122" x2="281.82" y2="372" stroke="#eef1ee"/><text x="281.82" y="392" text-anchor="middle" class="axis">8</text><line x1="412.00" y1="122" x2="412.00" y2="372" stroke="#eef1ee"/><text x="412.00" y="392" text-anchor="middle" class="axis">12</text><polyline points="54.00,160.92 86.55,215.49 119.09,254.83 151.64,276.67 184.18,290.05 216.73,300.36 249.27,310.15 281.82,320.24 314.36,330.79 346.91,341.81 379.45,353.25 412.00,365.04" fill="none" stroke="#245c42" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54.00" cy="160.92" r="5" fill="#fff" stroke="#245c42" stroke-width="2.5"/><circle cx="412.00" cy="365.04" r="5.5" fill="#245c42"/><polyline points="54.00,132.74 86.55,146.61 119.09,163.32 151.64,181.10 184.18,202.21 216.73,236.14 249.27,263.29 281.82,286.36 314.36,305.71 346.91,323.00 379.45,339.04 412.00,354.29" fill="none" stroke="#c56b32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54.00" cy="132.74" r="5" fill="#fff" stroke="#c56b32" stroke-width="2.5"/><circle cx="412.00" cy="354.29" r="5.5" fill="#c56b32"/><text x="20" y="416" class="axis">横軸: 評価回数　○ 開始　● 12回目</text><line x1="20" y1="442" x2="48" y2="442" stroke="#245c42" stroke-width="4"/><text x="58" y="447" class="method">通常の初期値</text><text x="420" y="447" text-anchor="end" class="metric">残差 1.867 → 0.03438</text><line x1="20" y1="476" x2="48" y2="476" stroke="#c56b32" stroke-width="4"/><text x="58" y="481" class="method">悪い初期値</text><text x="420" y="481" text-anchor="end" class="metric">残差 3.241 → 0.04242</text><text x="20" y="519" class="caption">実行生成: optimization_compass.</text><text x="20" y="540" class="caption">parameter_estimation.</text><text x="20" y="561" class="caption">generate_parameter_estimation_traces ·</text><text x="20" y="582" class="caption">dataset 0.18.23</text><text x="20" y="607" class="caveat">solverの条件を読むための固定した診断probeです。</text><text x="20" y="628" class="caveat">SciPy TRFの内部反復や性能差ではありません。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-siz