<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">短いrolloutは、境界がつながって初めて一本の軌道になる</title><desc id="figure-description">記事と同じ1 state、2 segment、segment duration 0.5の固定Multiple Shooting問題です。初期guessと、同じlinear continuity constraintsをexact equality KKTで解いた結果を比較します。segment rollout endpointと境界state decisionのずれ、terminal targetのずれ、defect norm、control costを示します。SciPy SLSQP自体の実行結果、非線形dynamics、path制約、一般的な収束性能は示しません。</desc><rect width="640" height="1080" rx="24" fill="#f7f6f1"/><text x="32" y="50" class="ms-title">短いrolloutは、境界がつながって初めて一本の軌道になる</text><text x="32" y="82" class="ms-subtitle">1 state · 2 segments · duration 0.5 · target 1.0</text><line x1="36" y1="116" x2="76" y2="116" stroke="#245c42" stroke-width="7"/><text x="86" y="122" class="ms-legend">segment rollout</text><circle cx="266" cy="116" r="8" fill="#d67835"/><text x="284" y="122" class="ms-legend">state decision</text><line x1="458" y1="102" x2="458" y2="128" stroke="#bd6754" stroke-width="5" stroke-dasharray="7 5"/><text x="474" y="122" class="ms-legend">defect</text><rect x="24" y="148.0" width="592" height="338" rx="18" fill="#fff" stroke="#cfd8d1"/><text x="44" y="183.0" class="ms-panel">初期guess</text><text x="596" y="183.0" text-anchor="end" class="ms-status">u=[0.50, 1.50] · ‖defect‖=0.354</text><rect x="76.0" y="206.0" width="500.0" height="205.0" rx="12" fill="#fbfcfa"/><line x1="76.0" y1="396.86" x2="576.0" y2="396.86" stroke="#ebe8e0"/><text x="66.0" y="402.86" text-anchor="end" class="ms-axis">0</text><line x1="76.0" y1="326.17" x2="576.0" y2="326.17" stroke="#ebe8e0"/><text x="66.0" y="332.17" text-anchor="end" class="ms-axis">0.5</text><line x1="76.0" y1="255.48" x2="576.0" y2="255.48" stroke="#ebe8e0"/><text x="66.0" y="261.48" text-anchor="end" class="ms-axis">1</text><line x1="76.0" y1="220.14" x2="576.0" y2="220.14" stroke="#ebe8e0"/><text x="66.0" y="226.14" text-anchor="end" class="ms-axis">1.25</te