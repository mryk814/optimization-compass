ic:tabular-nums}.ms-axis{font-size:16px;fill:#617068;font-variant-numeric:tabular-nums}.ms-label{font-size:15px;font-weight:700}.ms-defect{font-size:15px;fill:#a33d30;font-weight:700}.ms-result{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}.ms-provenance{font-size:14px;fill:#617068}.ms-caveat{font-size:14px;fill:#7a4b38}</style></svg>
