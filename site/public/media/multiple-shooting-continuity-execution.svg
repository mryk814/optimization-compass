<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 997" width="440" height="997" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">短い区間の前進計算は、境界がつながって初めて一本の軌道になる</title><desc id="figure-description">記事と同じ状態1個、区間2個、区間の長さ0.5の固定Multiple Shooting問題です。初期の推定値と、同じ線形の連続性制約を等式制約のKKTで厳密に解いた結果を比較します。区間の前進計算の終点と境界の状態の決定変数のずれ、終端の目標とのずれ、defectのノルム、制御のcostを示します。SciPy SLSQP自体の実行結果、非線形のdynamics、経路制約、一般的な収束性能は示しません。</desc><rect width="440" height="997" rx="16" fill="#f7f6f1"/><text x="20" y="34" class="title">短い区間の前進計算は、</text><text x="20" y="59" class="title">境界がつながって初めて一本の軌道になる</text><text x="20" y="84" class="subtitle">状態1個・区間2個・区間の長さ 0.5・目標 1.0</text><line x1="20" y1="110" x2="46" y2="110" stroke="#245c42" stroke-width="5"/><text x="54" y="115" class="note">区間の前進計算</text><circle cx="182" cy="110" r="6" fill="#d67835"/><text x="194" y="115" class="note">状態の決定変数</text><line x1="320" y1="100" x2="320" y2="118" stroke="#bd6754" stroke-width="3.5" stroke-dasharray="6 4"/><text x="330" y="115" class="note">defect</text><rect x="20" y="129" width="400" height="296" rx="12" fill="#fff" stroke="#d6ddd7"/><text x="34" y="157" class="panel-title">初期の推定値</text><text x="34" y="185" class="status">u=[0.50, 1.50] · ‖defect‖=0.354</text><rect x="60" y="209" width="318" height="170" rx="10" fill="#fbfcfa"/><line x1="60" y1="367.28" x2="378" y2="367.28" stroke="#ebe8e0"/><text x="54" y="372.28" text-anchor="end" class="axis">0</text><line x1="60" y1="308.66" x2="378" y2="308.66" stroke="#ebe8e0"/><text x="54" y="313.66" text-anchor="end" class="axis">0.5</text><line x1="60" y1="250.03" x2="378" y2="250.03" stroke="#ebe8e0"/><text x="54" y="255.03" text-anchor="end" class="axis">1</text><line x1="60" y1="220.72" x2="378" y2="220.72" stroke="#ebe8e0"/><text x="54" y="225.72" text-anchor="end" class="axis">1.25</text><text x="74.00" y="401" text-anchor="middle" class="axis">t₀</text><text x="219.00" y="401" text-anchor="middle" class="axis">境界</text><text x="364.00" y="401" text-anchor="middle" class="axis">終端</text><line x1="74.00" y1="367.28" x2="219.00" y2="337.97" stroke="#245c42" stroke-width="5" stroke-linecap="round"/><line x1="219.00" y1="308.66" x2="364.00" y2="220.72" stroke="#245c42" stroke-width="5" stroke-linecap="round"/><circle cx="74.00" cy="367.28" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="219.00" cy="308.66" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="364.00" cy="250.03" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><line x1="219.00" y1="337.97" x2="219.00" y2="308.66" stroke="#bd6754" stroke-width="3.5" stroke-dasharray="6 4"/><line x1="364.00" y1="220.72" x2="364.00" y2="250.03" stroke="#bd6754" stroke-width="3.5" stroke-dasharray="6 4"/><text x="74.00" y="355.28" text-anchor="middle" class="method halo">x₀</text><text x="219.00" y="296.66" text-anchor="middle" class="method halo">決定変数 x₁</text><text x="380.00" y="272.03" text-anchor="end" class="method halo">目標</text><text x="209.00" y="328.31" text-anchor="end" class="method halo" style="fill:#a33d30">δ₀=-0.25</text><text x="354.00" y="240.38" text-anchor="end" class="method halo" style="fill:#a33d30">δ₁=+0.25</text><rect x="20" y="437" width="400" height="296" rx="12" fill="#fff" stroke="#d6ddd7"/><text x="34" y="465" class="panel-title">連続性の制約を解いた後</text><text x="34" y="493" class="status">u=[1.00, 1.00] · ‖defect‖=0.000</text><rect x="60" y="517" width="318" height="170" rx="10" fill="#fbfcfa"/><line x1="60" y1="675.28" x2="378" y2="675.28" stroke="#ebe8e0"/><text x="54" y="680.28" text-anchor="end" class="axis">0</text><line x1="60" y1="616.66" x2="378" y2="616.66" stroke="#ebe8e0"/><text x="54" y="621.66" text-anchor="end" class="axis">0.5</text><line x1="60" y1="558.03" x2="378" y2="558.03" stroke="#ebe8e0"/><text x="54" y="563.03" text-anchor="end" class="axis">1</text><line x1="60" y1="528.72" x2="378" y2="528.72" stroke="#ebe8e0"/><text x="54" y="533.72" text-anchor="end" class="axis">1.25</text><text x="74.00" y="709" text-anchor="middle" class="axis">t₀</text><text x="219.00" y="709" text-anchor="middle" class="axis">境界</text><text x="364.00" y="709" text-anchor="middle" class="axis">終端</text><line x1="74.00" y1="675.28" x2="219.00" y2="616.66" stroke="#245c42" stroke-width="5" stroke-linecap="round"/><line x1="219.00" y1="616.66" x2="364.00" y2="558.03" stroke="#245c42" stroke-width="5" stroke-linecap="round"/><circle cx="74.00" cy="675.28" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="219.00" cy="616.66" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="364.00" cy="558.03" r="6" fill="#d67835" stroke="#fff" stroke-width="2"/><text x="74.00" y="663.28" text-anchor="middle" class="method halo">x₀</text><text x="219.00" y="604.66" text-anchor="middle" class="method halo">決定変数 x₁</text><text x="364.00" y="546.03" text-anchor="middle" class="method halo">目標</text><text x="20" y="767" class="metric">目的値</text><text x="420" y="767" text-anchor="end" class="metric-value">1.25 → 1.00</text><text x="20" y="793" class="metric">defectのノルム</text><text x="420" y="793" text-anchor="end" class="metric-value">0.354 → 0.0</text><text x="20" y="827" class="caption">実行生成: 固定した線形の区間積分 +</text><text x="20" y="848" class="caption">等式制約のKKTを厳密に解く · dataset 0.18.19</text><text x="20" y="873" class="caveat">記事と同じ2区間の定式化です。SciPy</text><text x="20" y="894" class="caveat">SLSQP自体の実行結果ではありません。</text><text x="20" y="915" class="caveat">非線形のdynamics、経路制約、積分誤差、</text><text x="20" y="936" class="caveat">solverの一般的な性能は示しません。</text><text x="20" y="957" class="caveat">実務では区間の分け方と積分のtolerance</text><text x="20" y="978" class="caveat">を変えて再検証します。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value{font-weight:750}.status,.axis,.note{fill:#617068}.caption{fill:#46554d}.caveat{fill:#7a4b38}.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></svg>
