<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">SO(3)へ戻る二つの一歩は、同じではない</title><desc id="figure-description">identityから同じnear-pi targetへ向かう固定Python実行です。Projected Gradientはambient step後にQR projectionし、Riemann勾配法はLie algebra上の接空間stepをexponential mapで戻します。12 updateのgeodesic residual、最初のmap correction、accepted rotationの直交性とdeterminant残差を比較します。固定3対応、noiseなし、固定stepの教材であり、一般性能rankingではありません。</desc><rect width="640" height="1080" rx="24" fill="#f7f6f1"/><text x="32" y="50" class="so-title">SO(3)へ戻る二つの一歩は、同じではない</text><text x="32" y="82" class="so-subtitle">identity → near-π target · fixed step 0.35 · 12 updates</text><line x1="36" y1="116" x2="78" y2="116" stroke="#d67835" stroke-width="6"/><text x="88" y="122" class="so-legend">ambient + QR projection</text><line x1="336" y1="116" x2="378" y2="116" stroke="#245c42" stroke-width="6" stroke-dasharray="10 7"/><text x="388" y="122" class="so-legend">tangent + exp map</text><text x="32" y="162" class="so-section">targetまでのgeodesic residual</text><rect x="70.0" y="190.0" width="520.0" height="245.0" rx="14" fill="#fff" stroke="#cfd8d1"/><line x1="70.0" y1="435.00" x2="590.0" y2="435.00" stroke="#ebe8e0"/><text x="58.0" y="441.00" text-anchor="end" class="so-axis">0</text><line x1="70.0" y1="347.50" x2="590.0" y2="347.50" stroke="#ebe8e0"/><text x="58.0" y="353.50" text-anchor="end" class="so-axis">1</text><line x1="70.0" y1="260.00" x2="590.0" y2="260.00" stroke="#ebe8e0"/><text x="58.0" y="266.00" text-anchor="end" class="so-axis">2</text><line x1="70.0" y1="190.00" x2="590.0" y2="190.00" stroke="#ebe8e0"/><text x="58.0" y="196.00" text-anchor="end" class="so-axis">2.8</text><line x1="70.00" y1="190.0" x2="70.00" y2="435.0" stroke="#f1efe9"/><text x="70.00" y="463.0" text-anchor="middle" class="so-axis">0</text><line x1="243.33" y1="190.0" x2="243.33" y2="435.0" stroke="#f1efe9"/><text x="243.33" y="463.0" text-anchor="middle" cla