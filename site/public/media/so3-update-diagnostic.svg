<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 930" width="440" height="930" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">SO(3)へ戻る二つの一歩は、同じではない</title><desc id="figure-description">単位行列から同じπに近い目標へ向かう固定Python実行です。Projected Gradientは外側の空間でstepを取った後にQRで射影し、Riemann勾配法はLie代数上の接空間でのstepをexponential mapで戻します。12回の更新のgeodesic残差、最初の更新での写像による補正、受理した回転の直交性と行列式の残差を比較します。固定3対応、ノイズなし、固定stepの教材であり、一般的な性能の順位ではありません。</desc><rect width="440" height="930" rx="16" fill="#f7f6f1"/><text x="20" y="34" class="title">SO(3)へ戻る二つの一歩は、同じではない</text><text x="20" y="59" class="subtitle">単位行列 → πに近い目標・固定step 0.35・更新12回</text><line x1="20" y1="85" x2="48" y2="85" stroke="#d67835" stroke-width="4"/><text x="56" y="90" class="note">外側の空間 + QRで射影</text><line x1="230" y1="85" x2="258" y2="85" stroke="#245c42" stroke-width="4" stroke-dasharray="8 6"/><text x="266" y="90" class="note">接空間 + exp map</text><rect x="20" y="104" width="400" height="266" rx="12" fill="#fff" stroke="#d6ddd7"/><text x="34" y="132" class="panel-title">目標までのgeodesic残差（rad）</text><line x1="52" y1="336.00" x2="404" y2="336.00" stroke="#ebe8e0"/><text x="44" y="341.00" text-anchor="end" class="axis">0</text><line x1="52" y1="271.71" x2="404" y2="271.71" stroke="#ebe8e0"/><text x="44" y="276.71" text-anchor="end" class="axis">1</text><line x1="52" y1="207.43" x2="404" y2="207.43" stroke="#ebe8e0"/><text x="44" y="212.43" text-anchor="end" class="axis">2</text><line x1="52" y1="156.00" x2="404" y2="156.00" stroke="#ebe8e0"/><text x="44" y="161.00" text-anchor="end" class="axis">2.8</text><line x1="52.00" y1="156" x2="52.00" y2="336" stroke="#f1efe9"/><text x="52.00" y="358" text-anchor="middle" class="axis">0</text><line x1="169.33" y1="156" x2="169.33" y2="336" stroke="#f1efe9"/><text x="169.33" y="358" text-anchor="middle" class="axis">4</text><line x1="286.67" y1="156" x2="286.67" y2="336" stroke="#f1efe9"/><text x="286.67" y="358" text-anchor="middle" class="axis">8</text><line x1="404.00" y1="156" x2="404.00" y2="336" stroke="#f1efe9"/><text x="404.00" y="358" text-anchor="middle" class="axis">12</text><polyline points="52.00,156.00 81.33,188.97 110.67,230.89 140.00,265.62 169.33,289.78 198.67,305.83 228.00,316.36 257.33,323.22 286.67,327.69 316.00,330.60 345.33,332.49 374.67,333.72 404.00,334.52" fill="none" stroke="#d67835" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="52.00,156.00 81.33,219.00 110.67,259.95 140.00,286.57 169.33,303.87 198.67,315.11 228.00,322.42 257.33,327.18 286.67,330.26 316.00,332.27 345.33,333.58 374.67,334.42 404.00,334.98" fill="none" stroke="#245c42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><circle cx="52.00" cy="156.00" r="4.5" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="169.33" cy="289.78" r="4.5" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="404.00" cy="334.52" r="4.5" fill="#d67835" stroke="#fff" stroke-width="2"/><circle cx="52.00" cy="156.00" r="4.5" fill="#245c42" stroke="#fff" stroke-width="2"/><circle cx="169.33" cy="303.87" r="4.5" fill="#245c42" stroke="#fff" stroke-width="2"/><circle cx="404.00" cy="334.98" r="4.5" fill="#245c42" stroke="#fff" stroke-width="2"/><text x="20" y="400" class="metric">QR</text><text x="420" y="400" text-anchor="end" class="metric-value">2.800 → 0.023 rad</text><text x="20" y="426" class="metric">Riemann</text><text x="420" y="426" text-anchor="end" class="metric-value">2.800 → 0.016 rad</text><text x="20" y="468" class="panel-title">最初の更新を分解する</text><rect x="20" y="486" width="400" height="118" rx="12" fill="#fff" stroke="#cfd8d1"/><circle cx="44" cy="508" r="8" fill="#d67835"/><text x="60" y="514" class="method">Projected Gradient</text><text x="34" y="542" class="metric">外側の空間でのstep ‖Δ‖</text><text x="406" y="542" text-anchor="end" class="metric-value">0.976</text><text x="34" y="568" class="metric">→ QRで戻す補正</text><text x="406" y="568" text-anchor="end" class="metric-value">1.136</text><text x="34" y="594" class="metric">→ 受理した回転の角度</text><text x="406" y="594" text-anchor="end" class="metric-value">2.287 rad</text><rect x="20" y="616" width="400" height="118" rx="12" fill="#fff" stroke="#cfd8d1"/><circle cx="44" cy="638" r="8" fill="#245c42"/><text x="60" y="644" class="method">Riemannian Gradient</text><text x="34" y="672" class="metric">接空間でのstep ‖ξ‖</text><text x="406" y="672" text-anchor="end" class="metric-value">0.980</text><text x="34" y="698" class="metric">→ 1次近似との差</text><text x="406" y="698" text-anchor="end" class="metric-value">0.661</text><text x="34" y="724" class="metric">→ 受理した回転の角度</text><text x="406" y="724" text-anchor="end" class="metric-value">1.820 rad</text><text x="20" y="768" class="panel-title">受理した回転の構造の残差（最大値）</text><text x="20" y="792" class="metric">QR: 直交性 2.00e-12 · 行列式 1.00e-12</text><text x="20" y="814" class="metric">Riemann: 直交性 5.00e-12 · 行列式 2.00e-12</text><text x="20" y="844" class="caption">実行生成: optimization_compass.constraint_geometry.</text><text x="20" y="865" class="caption">generate_so3_traces · dataset 0.18.23</text><text x="20" y="890" class="caveat">固定した3対応・ノイズなし・固定stepです。</text><text x="20" y="911" class="caveat">速さの順位や、一般的な局所収束は示しません。</text><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26352d;font-size:15px}.title{font-size:18px;font-weight:750}.subtitle{fill:#617068}.panel-title{font-size:17px;font-weight:750}.method{font-size:16px;font-weight:750}.metric,.metric-value{font-size:16px;font-variant-numeric:tabular-nums}.metric-value{font-weight:750}.status,.axis,.note{fill:#617068}.caption{fill:#46554d}.caveat{fill:#7a4b38}.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></svg>
