<svg xmlns="http://www.w3.org/2000/svg" width="440" height="488" viewBox="0 0 440 488" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">4つの活性集合の判定</title><desc id="figure-description">二つの接触点の例で、各点が接触しているかどうかの4通りを z1 と z2 の平面に描きます。どちらの接触点も接触している候補だけが z も w も非負で、解です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="488" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">4つの活性集合の判定</text><polygon points="62.0,58.0 62.0,71.4 152.8,161.0 416.0,225.9 416.0,58.0" fill="#91b8a4" fill-opacity="0.45"/><path d="M62 58V340H416" fill="none" stroke="#17211b" stroke-width="1.5"/><text x="62.0" y="360.0" class="tick" text-anchor="middle">0</text><text x="334.3" y="360.0" class="tick" text-anchor="middle">0.5</text><text x="54.0" y="345.0" class="tick" text-anchor="end">0</text><text x="54.0" y="210.7" class="tick" text-anchor="end">0.5</text><text x="54.0" y="76.4" class="tick" text-anchor="end">1</text><text x="416.0" y="380.0" text-anchor="end">z₁（点Aの接触力）</text><text x="54.0" y="50.0">z₂（点B）</text><polyline points="62.00,71.43 334.31,340.00" fill="none" stroke="#315c48" stroke-width="2.5" stroke-linejoin="round"/><polyline points="62.00,138.57 416.00,225.86" fill="none" stroke="#315c48" stroke-width="2.5" stroke-linejoin="round"/><text x="213.4" y="237.6" class="note" text-anchor="end">w₁=0</text><text x="377.9" y="240.5" class="note" text-anchor="middle">w₂=0</text><circle cx="62.0" cy="340.0" r="7" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="76.0" y="328.0">接触なし（w&lt;0）</text><circle cx="334.3" cy="340.0" r="7" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="322.3" y="326.0" text-anchor="end">Aだけ（w&lt;0）</text><circle cx="62.0" cy="138.6" r="7" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="76.0" y="124.6">Bだけ（w&lt;0）</text><circle cx="152.8" cy="161.0" r="7" fill="#b3532d"/><text x="166.8" y="147.0">AとB（解）</text><text x="20.0" y="424.0">橙の点：z≧0 かつ w≧0 を満たす候補（解）</text><text x="20.0" y="448.0" class="note">薄緑：w₁≧0 かつ w₂≧0 の領域</text><text x="20.0" y="472.0" class="note">白抜き：w に負の成分があり、解ではない</text></svg>
