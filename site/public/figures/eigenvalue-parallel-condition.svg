<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">最小の向きでは、M n が n と同じ向きになる</title><desc id="figure-description">長さ1の向き n と、行列 M=[[4,4],[4,10]] を掛けた M n の矢印。n=(1,0) では M n=(4,4) で、n と向きが違う。二乗和が最小の向き n=(2,−1)/√5 では M n=2n で、同じ向きを指す。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="360" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">最小の向きでは、M n が n と同じ向きになる</text><defs><marker id="eig-head-n" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24406b"/></marker><marker id="eig-head-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3532d"/></marker></defs><circle cx="120.0" cy="190.0" r="56.0" fill="none" stroke="#aab4ab" stroke-width="1.5"/><path d="M120.0 190.0L176.0 190.0" stroke="#24406b" stroke-width="3" marker-end="url(#eig-head-n)"/><path d="M120.0 190.0L176.0 134.0" stroke="#b3532d" stroke-width="3" marker-end="url(#eig-head-m)"/><text x="120.0" y="300.0" text-anchor="middle">n=(1, 0)</text><text x="120.0" y="324.0" class="note" text-anchor="middle">M n=(4, 4)</text><circle cx="320.0" cy="190.0" r="56.0" fill="none" stroke="#aab4ab" stroke-width="1.5"/><path d="M320.0 190.0L370.1 215.0" stroke="#24406b" stroke-width="3" marker-end="url(#eig-head-n)"/><path d="M320.0 190.0L345.0 202.5" stroke="#b3532d" stroke-width="3" marker-end="url(#eig-head-m)"/><text x="320.0" y="300.0" text-anchor="middle">n=(2, −1)/√5</text><text x="320.0" y="324.0" class="note" text-anchor="middle">M n=2 n</text><text x="20.0" y="64.0" class="tick">紺：長さ1の向き n（円の上）　橙：M n</text><text x="20.0" y="350.0" class="tick">同じ向きのとき、円に沿って回す向きの傾きが0</text></svg>
