<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">6回の焼き温度と、予測のばらつき</title><desc id="figure-description">① 6回の焼き温度の選び方。等間隔、中央付近（172・180・188℃に2回ずつ）、端と中央に2回ずつ（160・180・200℃）、両端だけ（160℃と200℃に3回ずつ）。両端だけでは2次式の係数が決まらない。② 点数を2次式で予測したときの、予測のばらつき（測定の誤差の分散を1とした値）。等間隔は最大 0.82（det M = 16.1）、中央付近は最大 25.11（det M = 0.131）、端と中央に2回ずつは最大 0.50（det M = 32）。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="640" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">6回の焼き温度と、予測のばらつき</text><text x="20.0" y="64.0">① 6回の焼き温度</text><path d="M64 112.0H410" stroke="#aab4ab"/><text x="64.0" y="96.0" class="tick">等間隔</text><circle cx="79.7" cy="112.0" r="5.5" fill="#24406b"/><circle cx="142.6" cy="112.0" r="5.5" fill="#24406b"/><circle cx="205.5" cy="112.0" r="5.5" fill="#24406b"/><circle cx="268.5" cy="112.0" r="5.5" fill="#24406b"/><circle cx="331.4" cy="112.0" r="5.5" fill="#24406b"/><circle cx="394.3" cy="112.0" r="5.5" fill="#24406b"/><path d="M64 158.0H410" stroke="#aab4ab"/><text x="64.0" y="142.0" class="tick">中央付近</text><circle cx="167.6" cy="158.0" r="5.5" fill="#b3532d"/><circle cx="180.6" cy="158.0" r="5.5" fill="#b3532d"/><circle cx="230.5" cy="158.0" r="5.5" fill="#b3532d"/><circle cx="243.5" cy="158.0" r="5.5" fill="#b3532d"/><circle cx="293.4" cy="158.0" r="5.5" fill="#b3532d"/><circle cx="306.4" cy="158.0" r="5.5" fill="#b3532d"/><path d="M64 204.0H410" stroke="#aab4ab"/><text x="64.0" y="188.0" class="tick">端と中央に2回ずつ</text><circle cx="73.2" cy="204.0" r="5.5" fill="#315c48"/><circle cx="86.2" cy="204.0" r="5.5" fill="#315c48"/><circle cx="230.5" cy="204.0" r="5.5" fill="#315c48"/><circle cx="243.5" cy="204.0" r="5.5" fill="#315c48"/><circle cx="387.8" cy="204.0" r="5.5" fill="#315