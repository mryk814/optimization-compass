<svg xmlns="http://www.w3.org/2000/svg" width="440" height="340" viewBox="0 0 440 340" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">毎回ゼロからと、前回の作業集合から</title><desc id="figure-description">12回の注文ごとに、連立一次方程式を解いた回数。毎回ゼロから始めると合計31回、前回の作業集合から始めると合計20回。同じ制約が効き続ける回は、前回から始めると1回で済む。12回目は注文が2から6.5へ跳び、どちらも3回かかる。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="340" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">毎回ゼロからと、前回の作業集合から</text><text x="20.0" y="64.0">連立一次方程式を解いた回数</text><path d="M64 94V262H410" fill="none" stroke="#aab4ab"/><text x="56.0" y="267.0" class="tick" text-anchor="end">0</text><text x="56.0" y="211.0" class="tick" text-anchor="end">1</text><text x="56.0" y="155.0" class="tick" text-anchor="end">2</text><text x="56.0" y="99.0" class="tick" text-anchor="end">3</text><rect x="68.0" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="78.4" y="94.0" width="10.4" height="168.0" fill="#b3532d"/><text x="78.4" y="282.0" class="tick" text-anchor="middle">1</text><rect x="96.8" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="107.2" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="107.2" y="282.0" class="tick" text-anchor="middle">2</text><rect x="125.7" y="150.0" width="10.4" height="112.0" fill="#56645b"/><rect x="136.1" y="150.0" width="10.4" height="112.0" fill="#b3532d"/><text x="136.1" y="282.0" class="tick" text-anchor="middle">3</text><rect x="154.5" y="150.0" width="10.4" height="112.0" fill="#56645b"/><rect x="164.9" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="164.9" y="282.0" class="tick" text-anchor="middle">4</text><rect x="183.3" y="150.0" width="10.4" height="112.0" fill="#56645b"/><rect x="193.8" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="193.8" y="282.0" class="tick" text-anchor="middle">5</text><rect x="212.2" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="222.6" y="150.0" width="10.4" height="112.0" fill="#b3532d"/><text x="222.6" y="282.0" class="tick" text-anchor="middle">6</text><rect x="241.0" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="251.4" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="251.4" y="282.0" class="tick" text-anchor="middle">7</text><rect x="269.8" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="280.2" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="280.2" y="282.0" class="tick" text-anchor="middle">8</text><rect x="298.7" y="150.0" width="10.4" height="112.0" fill="#56645b"/><rect x="309.1" y="150.0" width="10.4" height="112.0" fill="#b3532d"/><text x="309.1" y="282.0" class="tick" text-anchor="middle">9</text><rect x="327.5" y="150.0" width="10.4" height="112.0" fill="#56645b"/><rect x="337.9" y="206.0" width="10.4" height="56.0" fill="#b3532d"/><text x="337.9" y="282.0" class="tick" text-anchor="middle">10</text><rect x="356.3" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="366.8" y="150.0" width="10.4" height="112.0" fill="#b3532d"/><text x="366.8" y="282.0" class="tick" text-anchor="middle">11</text><rect x="385.2" y="94.0" width="10.4" height="168.0" fill="#56645b"/><rect x="395.6" y="94.0" width="10.4" height="168.0" fill="#b3532d"/><text x="395.6" y="282.0" class="tick" text-anchor="middle">12</text><text x="410.0" y="304.0" class="tick" text-anchor="end">何回目の注文か</text><rect x="64" y="316" width="14" height="14" fill="#56645b"/><text x="84.0" y="328.0" class="tick">毎回ゼロから：合計31</text><rect x="250" y="316" width="14" height="14" fill="#b3532d"/><text x="270.0" y="328.0" class="tick">前回から：合計20</text></svg>
