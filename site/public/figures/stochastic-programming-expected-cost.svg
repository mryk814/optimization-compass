<svg xmlns="http://www.w3.org/2000/svg" width="440" height="622" viewBox="0 0 440 622" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">天気ごとの費用と、その期待値</title><desc id="figure-description">朝に作る弁当の数 x（0〜100個）と費用。1個100円で作り、足りない分は1個250円で取り寄せる。① 需要が雨20個・曇り40個・晴れ80個の三つの場合の費用の折れ線。② 確率0.3・0.4・0.3で重みを付けた期待費用。期待費用は x=40 で最小の 7000 円、平均の需要 46 個では 7150 円、最大の需要 80 個では 8000 円。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="622" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">天気ごとの費用と、その期待値</text><text x="76.0" y="300.0" class="tick" text-anchor="middle">0</text><text x="76.0" y="584.0" class="tick" text-anchor="middle">0</text><text x="142.8" y="300.0" class="tick" text-anchor="middle">20</text><text x="142.8" y="584.0" class="tick" text-anchor="middle">20</text><text x="209.6" y="300.0" class="tick" text-anchor="middle">40</text><text x="209.6" y="584.0" class="tick" text-anchor="middle">40</text><text x="276.4" y="300.0" class="tick" text-anchor="middle">60</text><text x="276.4" y="584.0" class="tick" text-anchor="middle">60</text><text x="343.2" y="300.0" class="tick" text-anchor="middle">80</text><text x="343.2" y="584.0" class="tick" text-anchor="middle">80</text><text x="410.0" y="300.0" class="tick" text-anchor="middle">100</text><text x="410.0" y="584.0" class="tick" text-anchor="middle">100</text><text x="20.0" y="64.0">① 天気ごとの費用（円）</text><path d="M76 80V280H410" fill="none" stroke="#aab4ab"/><text x="68.0" y="285.0" class="tick" text-anchor="end">0</text><text x="68.0" y="205.0" class="tick" text-anchor="end">10千</text><text x="68.0" y="125.0" class="tick" text-anchor="end">20千</text><polyline points="76.00,120.00 343.20,216.00 410.00,200.00" fill="none" stroke="#b3532d" stroke-width="2.5" stroke-linejoin="round"/><polyline points="300.00,99.00 322.00,99.00" fill="none" stroke="#b3532d" stroke-width="2.5" stroke-linejoin="round"/><text x="330.0" y="104.0" class="tick">晴れ 80個</text><polyline points="76.00,200.00 209.60,248.00 410.00,200.00" fill="none" stroke="#56645b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="300.00,123.00 322.00,123.00" fill="none" stroke="#56645b" stroke-width="2.5" stroke-linejoin="round"/><text x="330.0" y="128.0" class="tick">曇り 40個</text><polyline points="76.00,240.00 142.80,264.00 410.00,200.00" fill="none" stroke="#24406b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="300.00,147.00 322.00,147.00" fill="none" stroke="#24406b" stroke-width="2.5" stroke-linejoin="round"/><text x="330.0" y="152.0" class="tick">雨 20個</text><text x="20.0" y="340.0">② 期待費用（円）</text><path d="M76 364V564H410" fill="none" stroke="#aab4ab"/><text x="68.0" y="569.0" class="tick" text-anchor="end">6千</text><text x="68.0" y="502.3" class="tick" text-anchor="end">8千</text><text x="68.0" y="435.7" class="tick" text-anchor="end">10千</text><text x="68.0" y="369.0" class="tick" text-anchor="end">12千</text><polyline points="76.00,380.67 142.80,480.67 209.60,530.67 343.20,497.33 410.00,430.67" fill="none" stroke="#315c48" stroke-width="3" stroke-linejoin="round"/><circle cx="209.6" cy="530.7" r="6" fill="#b3532d"/><text x="197.6" y="556.7" class="tick" text-anchor="end">x=40：7000</text><circle cx="229.6" cy="525.7" r="6" fill="#24406b"/><text x="243.6" y="551.7" class="tick">x=46：7150</text><circle cx="343.2" cy="497.3" r="6" fill="#56645b"/><text x="331.2" y="485.3" class="tick" text-anchor="end">x=80：8000</text><text x="410.0" y="604.0" class="tick" text-anchor="end">朝に作る数 x（個）</text><text x="20.0" y="604.0" class="note">最小は x=40</text></svg>
