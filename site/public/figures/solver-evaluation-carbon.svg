<svg xmlns="http://www.w3.org/2000/svg" width="440" height="386" viewBox="0 0 440 386" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">評価の番号と、渡された炭素量 c</title><desc id="figure-description">初期点 T=1200 K、c=0.0005 から、SciPy の三通りの使い方で費用の計算ツールを最小化したときに、ツールへ渡された炭素量 c を評価の番号ごとに描く。c が 0 以下だとツールはエラーを返す。fmin（Nelder–Mead）は 16 回目に c=−0.00002 を渡した。c の下限 0 を与えた Nelder–Mead は 15 回目まで同じ点を通り、16 回目に境界の c=0 そのものを渡した。minimize の既定（BFGS）は 4 回目に c=−1.01 を渡した。BFGS の◆は、重ならないように少し上にずらして描く。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="386" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">評価の番号と、渡された炭素量 c</text><path d="M76 128V300H410" fill="none" stroke="#aab4ab"/><text x="68.0" y="270.6" class="tick" text-anchor="end">0</text><text x="68.0" y="224.7" class="tick" text-anchor="end">2</text><text x="68.0" y="178.9" class="tick" text-anchor="end">4</text><text x="68.0" y="133.0" class="tick" text-anchor="end">6</text><text x="76.0" y="322.0" class="tick" text-anchor="middle">1</text><text x="142.8" y="322.0" class="tick" text-anchor="middle">4</text><text x="231.9" y="322.0" class="tick" text-anchor="middle">8</text><text x="320.9" y="322.0" class="tick" text-anchor="middle">12</text><text x="410.0" y="322.0" class="tick" text-anchor="middle">16</text><path d="M76 265.6H410" stroke="#c23a2b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="84.0" y="257.6" class="tick">c=0 以下はエラー</text><polyline points="76.00,150.93 98.27,150.93 120.53,145.20 142.80,156.67 165.07,162.40 187.33,162.40 209.60,153.80 231.87,165.27 254.13,172.43 276.40,181.03 298.67,191.07 320.93,205.40 343.20,196.80 365.47,204.68 387.73,237.65 410.00,270.26" fill="none" stroke="#91b8a4" stroke-width="2" stroke-linejoin="round"/><circle cx="76.0" cy="150.9" r="4.5" fill="#24406b"/><circle cx="98.3" cy="150.9" r="4.5" fill="#24406b"/><circle cx="120.5" cy="145.2" r="4.5" fill="#24406b"/><circle cx="142.8" cy="156.7" r="4.5" fill="#24406b"/><circle cx="165.1" cy="162.4" r="4.5" fill="#24406b"/><circle cx="187.3" cy="162.4" r="4.5" fill="#24406b"/><circle cx="209.6" cy="153.8" r="4.5" fill="#24406b"/><circle cx="231.9" cy="165.3" r="4.5" fill="#24406b"/><circle cx="254.1" cy="172.4" r="4.5" fill="#24406b"/><circle cx="276.4" cy="181.0" r="4.5" fill="#24406b"/><circle cx="298.7" cy="191.1" r="4.5" fill="#24406b"/><circle cx="320.9" cy="205.4" r="4.5" fill="#24406b"/><circle cx="343.2" cy="196.8" r="4.5" fill="#24406b"/><circle cx="365.5" cy="204.7" r="4.5" fill="#24406b"/><circle cx="387.7" cy="237.7" r="4.5" fill="#24406b"/><circle cx="410.0" cy="270.3" r="6" fill="#c23a2b" stroke="#17211b" stroke-width="1.5"/><rect x="404.0" y="259.6" width="12" height="12" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><path d="M76.0 130.9L82.0 136.9L76.0 142.9L70.0 136.9Z" fill="#b3532d"/><path d="M98.3 130.9L104.3 136.9L98.3 142.9L92.3 136.9Z" fill="#b3532d"/><path d="M120.5 130.9L126.5 136.9L120.5 142.9L114.5 136.9Z" fill="#b3532d"/><path d="M142.8 273.6V298" stroke="#b3532d" stroke-width="2.5"/><path d="M136.8 290L142.8 300L148.8 290" fill="none" stroke="#b3532d" stroke-width="2.5"/><text x="152.8" y="290.0" class="tick">4回目 c=−1.01（図の外）</text><circle cx="28" cy="55" r="5" fill="#24406b"/><text x="42.0" y="60.0" class="tick">fmin：16回目に c=−0.00002</text><rect x="22" y="71" width="12" height="12" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><text x="42.0" y="82.0" class="tick">下限0つき Nelder–Mead：16回目に c=0</text><path d="M28 93L34 99L28 105L22 99Z" fill="#b3532d"/><text x="42.0" y="104.0" class="tick">minimize の既定（BFGS）</text><text x="20.0" y="344.0" class="tick">縦軸 c（×10⁻⁴）、横軸 評価の番号。◆は上にずらす</text><text x="20.0" y="368.0" class="tick">初期点 T=1200 K、c=0.0005。SciPy 1.18.1</text></svg>
