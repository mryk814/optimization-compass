<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">最短の7分は、道が3本の経路</title><desc id="figure-description">拠点Sから客先Tへ向かう、一方通行の7本の道の図です。辺の数字は所要時間（分）で、各点の d はSからの最短時間です。道の数が最少ではS→Tで12分、次の道が最安ではS→A→B→C→Tで10分、合計が最小のS→B→C→Tは7分です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="520" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">最短の7分は、道が3本の経路</text><defs><marker id="path-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3532d"/></marker><marker id="path-head-quiet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aab4ab"/></marker></defs><path d="M60.5 180.6L130.0 141.3" fill="none" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#path-head-quiet)"/><text x="86.0" y="152.0" text-anchor="end">2</text><path d="M60.5 199.4L130.0 238.7" fill="none" stroke="#b3532d" stroke-width="5" stroke-linecap="round" marker-end="url(#path-head)"/><text x="86.0" y="238.0" text-anchor="end">4</text><path d="M56.2 175.4Q220.0 -20.0 381.2 172.4" fill="none" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#path-head-quiet)"/><text x="220.0" y="66.0" text-anchor="middle">12</text><path d="M150.0 149.0L150.0 227.0" fill="none" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#path-head-quiet)"/><text x="162.0" y="196.0">5</text><path d="M168.5 134.5L373.7 184.6" fill="none" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#path-head-quiet)"/><text x="273.0" y="148.0" text-anchor="middle">6</text><path d="M169.0 250.0L267.0 250.0" fill="none" stroke="#b3532d" stroke-width="5" stroke-linecap="round" marker-end="url(#path-head)"/><text x="220.0" y="238.0" text-anchor="middle">1</text><path d="M306.5 240.6L376.0 201.3" fill="none" stroke="#b3532d" stroke-width="5" stroke-linecap="round" marker-end="url(#path-head)"/><text x="356.0" y="246.0">2</text><circle cx="44" cy="190" r="19" fill="#ffffff" stroke="#b3532d" stroke-width="2"/><text x="44.0" y="196.0" text-anchor="middle">S</text><text x="44.0" y="226.0" class="tick" text-anchor="middle">d=0</text><circle cx="150" cy="130" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="150.0" y="136.0" text-anchor="middle">A</text><text x="150.0" y="170.0" class="tick" text-anchor="middle">d=2</text><circle cx="150" cy="250" r="19" fill="#ffffff" stroke="#b3532d" stroke-width="2"/><text x="150.0" y="256.0" text-anchor="middle">B</text><text x="150.0" y="286.0" class="tick" text-anchor="middle">d=4</text><circle cx="290" cy="250" r="19" fill="#ffffff" stroke="#b3532d" stroke-width="2"/><text x="290.0" y="256.0" text-anchor="middle">C</text><text x="290.0" y="286.0" class="tick" text-anchor="middle">d=5</text><circle cx="396" cy="190" r="19" fill="#ffffff" stroke="#b3532d" stroke-width="2"/><text x="396.0" y="196.0" text-anchor="middle">T</text><text x="396.0" y="226.0" class="tick" text-anchor="middle">d=7</text><text x="20.0" y="322.0" class="tick">辺の数字：所要時間（分）　d：Sからの最短時間</text><text x="20.0" y="358.0">道の数が最少</text><text x="420" y="358" text-anchor="end">12分</text><text x="20.0" y="380.0" class="tick">S→T（道1本）</text><text x="20.0" y="414.0">次の道が最安</text><text x="420" y="414" text-anchor="end">10分</text><text x="20.0" y="436.0" class="tick">S→A→B→C→T（道4本）</text><text x="20.0" y="470.0">合計が最小</text><text x="420" y="470" text-anchor="end" style="fill:#b3532d">7分</text><text x="20.0" y="492.0" class="tick">S→B→C→T（道3本）</text></svg>
