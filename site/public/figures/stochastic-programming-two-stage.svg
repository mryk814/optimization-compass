<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">朝の決定は一つ、昼の対応は天気ごと</title><desc id="figure-description">朝に作る数 x は天気を知る前に一つだけ決める（例では x=40）。天気が分かった後の取り寄せ数 y は、雨・曇り・晴れの枝ごとに別々に決める。x=40 なら y は雨0・曇り0・晴れ40。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="370" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">朝の決定は一つ、昼の対応は天気ごと</text><rect x="20.0" y="176.0" width="100" height="68" rx="10" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="70.0" y="204.0" text-anchor="middle">朝</text><text x="70.0" y="228.0" text-anchor="middle">x=40</text><path d="M120.0 210.0L250 120.0" stroke="#aab4ab" stroke-width="2"/><text x="185.0" y="155.0" class="tick" text-anchor="middle">0.3</text><rect x="250" y="90.0" width="170" height="60" rx="10" fill="#ffffff" stroke="#315c48" stroke-width="2"/><text x="262.0" y="114.0">雨：注文 20</text><text x="262.0" y="138.0" class="note">取り寄せ y=0</text><path d="M120.0 210.0L250 210.0" stroke="#aab4ab" stroke-width="2"/><text x="185.0" y="200.0" class="tick" text-anchor="middle">0.4</text><rect x="250" y="180.0" width="170" height="60" rx="10" fill="#ffffff" stroke="#315c48" stroke-width="2"/><text x="262.0" y="204.0">曇り：注文 40</text><text x="262.0" y="228.0" class="note">取り寄せ y=0</text><path d="M120.0 210.0L250 300.0" stroke="#aab4ab" stroke-width="2"/><text x="185.0" y="245.0" class="tick" text-anchor="middle">0.3</text><rect x="250" y="270.0" width="170" height="60" rx="10" fill="#ffffff" stroke="#315c48" stroke-width="2"/><text x="262.0" y="294.0">晴れ：注文 80</text><text x="262.0" y="318.0" class="note">取り寄せ y=40</text><text x="20.0" y="64.0" class="tick">天気が分かる前</text><text x="420.0" y="64.0" class="tick" text-anchor="end">天気が分かった後</text><text x="20.0" y="358.0" class="tick">線の数字は天気の確率</text></svg>
