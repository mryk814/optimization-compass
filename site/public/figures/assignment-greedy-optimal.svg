<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">近い組から決めると、合計が延びる</title><desc id="figure-description">救急車3台と通報A・B・Cの到着時間（分）の表を2枚並べたもの。① 近い組から決めると 2、8、14 分を選び、合計は 24 分。② 合計が最小の割当は 3、3、9 分を選び、合計は 15 分。どちらも各行・各列から一つずつ選んでいる。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="520" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">近い組から決めると、合計が延びる</text><text x="20.0" y="66.0">① 近い組から決める</text><text x="420.0" y="66.0" class="note" text-anchor="end">合計 24 分</text><text x="210.0" y="94.0" text-anchor="middle">通報A</text><text x="294.0" y="94.0" text-anchor="middle">通報B</text><text x="378.0" y="94.0" text-anchor="middle">通報C</text><text x="156.0" y="133.0" text-anchor="end">救急車1</text><rect x="171" y="107.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="133.0" text-anchor="middle">3</text><rect x="255" y="107.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="294.0" y="133.0" text-anchor="middle">2</text><text x="262.0" y="125.0" class="tick">①</text><rect x="339" y="107.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="133.0" text-anchor="middle">5</text><text x="156.0" y="179.0" text-anchor="end">救急車2</text><rect x="171" y="153.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="179.0" text-anchor="middle">10</text><rect x="255" y="153.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="179.0" text-anchor="middle">3</text><rect x="339" y="153.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="378.0" y="179.0" text-anchor="middle">8</text><text x="346.0" y="171.0" class="tick">②</text><text x="156.0" y="225.0" text-anchor="end">救急車3</text><rect x="171" y="199.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="210.0" y="225.0" text-anchor="middle">14</text><text x="178.0" y="217.0" class="tick">③</text><rect x="255" y="199.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="225.0" text-anchor="middle">5</text><rect x="339" y="199.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="225.0" text-anchor="middle">9</text><text x="20.0" y="296.0">② 合計が最小の割当</text><text x="420.0" y="296.0" class="note" text-anchor="end">合計 15 分</text><text x="210.0" y="324.0" text-anchor="middle">通報A</text><text x="294.0" y="324.0" text-anchor="middle">通報B</text><text x="378.0" y="324.0" text-anchor="middle">通報C</text><text x="156.0" y="363.0" text-anchor="end">救急車1</text><rect x="171" y="337.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="210.0" y="363.0" text-anchor="middle">3</text><rect x="255" y="337.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="363.0" text-anchor="middle">2</text><rect x="339" y="337.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="363.0" text-anchor="middle">5</text><text x="156.0" y="409.0" text-anchor="end">救急車2</text><rect x="171" y="383.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="409.0" text-anchor="middle">10</text><rect x="255" y="383.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="294.0" y="409.0" text-anchor="middle">3</text><rect x="339" y="383.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="409.0" text-anchor="middle">8</text><text x="156.0" y="455.0" text-anchor="end">救急車3</text><rect x="171" y="429.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="455.0" text-anchor="middle">14</text><rect x="255" y="429.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="455.0" text-anchor="middle">5</text><rect x="339" y="429.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="378.0" y="455.0" text-anchor="middle">9</text><text x="20.0" y="496.0">① 2 + 8 + 14 = 24</text><text x="420.0" y="496.0" class="note" text-anchor="end">② 3 + 3 + 9 = 15</text></svg>
