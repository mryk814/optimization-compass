<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">グループごとに縮める</title><desc id="figure-description">最初の一歩の v。駅Aの v は (0.85, 0.55) で長さ 1.012、半径 0.45 の円の外なので長さが 0.45 縮み、(0.472, 0.306) になります。駅Bの v は (0.3, 0.25) で長さ 0.391、円の中なので (0, 0) です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="560" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">グループごとに縮める</text><text x="20.0" y="66.0" class="title">駅A（x₁, x₂）</text><rect x="56" y="78.0" width="180" height="180" fill="#ffffff" stroke="#aab4ab"/><circle cx="78.5" cy="235.5" r="67.5" fill="#f2c9b4" stroke="#b3532d" stroke-width="1.5"/><text x="78.5" y="278.0" class="tick" text-anchor="middle">0</text><text x="50.0" y="240.5" class="tick" text-anchor="end">0</text><text x="153.5" y="278.0" class="tick" text-anchor="middle">0.5</text><text x="50.0" y="165.5" class="tick" text-anchor="end">0.5</text><text x="228.5" y="278.0" class="tick" text-anchor="middle">1</text><text x="50.0" y="90.5" class="tick" text-anchor="end">1</text><text x="250.0" y="283.0" class="tick">v₁ 軸</text><text x="62.0" y="96.0" class="tick">v₂</text><path d="M206.0 153.0L149.3 189.7" stroke="#b3532d" stroke-width="3"/><circle cx="206.0" cy="153.0" r="6" fill="#24406b"/><circle cx="149.3" cy="189.7" r="7" fill="#b3532d"/><circle cx="78.5" cy="235.5" r="2.5" fill="#17211b"/><text x="250.0" y="118.0">v = (0.85, 0.55)</text><text x="250.0" y="146.0">長さ 1.012 &gt; 0.45</text><text x="250.0" y="174.0" class="note">→ (0.472, 0.306)</text><text x="250.0" y="202.0" class="note">長さが 0.45 縮む</text><text x="20.0" y="316.0" class="title">駅B（x₃, x₄）</text><rect x="56" y="328.0" width="180" height="180" fill="#ffffff" stroke="#aab4ab"/><circle cx="78.5" cy="485.5" r="67.5" fill="#f2c9b4" stroke="#b3532d" stroke-width="1.5"/><text x="78.5" y="528.0" class="tick" text-anchor="middle">0</text><text x="50.0" y="490.5" class="tick" text-anchor="end">0</text><text x="153.5" y="528.0" class="tick" text-anchor="middle">0.5</text><text x="50.0" y="415.5" class="tick" text-anchor="end">0.5</text><text x="228.5" y="528.0" class="tick" text-anchor="middle">1</text><text x="50.0" y="340.5" class="tick" text-anchor="end">1</text><text x="250.0" y="533.0" class="tick">v₃ 軸</text><text x="62.0" y="346.0" class="tick">v₄</text><path d="M123.5 448.0L78.5 485.5" stroke="#b3532d" stroke-width="3"/><circle cx="123.5" cy="448.0" r="6" fill="#24406b"/><circle cx="78.5" cy="485.5" r="7" fill="#b3532d"/><circle cx="78.5" cy="485.5" r="2.5" fill="#17211b"/><text x="250.0" y="368.0">v = (0.3, 0.25)</text><text x="250.0" y="396.0">長さ 0.391 ≤ 0.45</text><text x="250.0" y="424.0" class="note">→ (0, 0)</text><text x="250.0" y="452.0" class="note">円の中は丸ごと 0</text><text x="20.0" y="566.0" class="note">橙の円：半径 0.45。中の点は 0 に落ちる</text><text x="20.0" y="590.0" class="note">紺の丸：v、橙の丸：prox(v)</text></svg>
