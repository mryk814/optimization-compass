<svg xmlns="http://www.w3.org/2000/svg" width="440" height="758" viewBox="0 0 440 758" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">3集落に届く中継局</title><desc id="figure-description">集落A(0,0)、B(6,0)、C(2,4)と、半径3.6kmと半径√10の円です。半径3.6kmでは3つの円が重なる領域があり、重心(2.67, 1.33)もその中にあります。半径√10≈3.162kmでは、3つの円が点(3, 1)だけで重なります。その点から各集落へ向かう矢印の長さは重み1/3、5/12、1/4に比例し、3本の和は0です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="758" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">3集落に届く中継局</text><text x="20.0" y="66.0" class="title">半径 3.6 km</text><clipPath id="socp-a"><rect x="64.0" y="79.0" width="334.0" height="255.0"/></clipPath><rect x="64.0" y="79.0" width="334.0" height="255.0" fill="#ffffff" stroke="#aab4ab"/><clipPath id="socp-a-0"><circle cx="99.16" cy="290.03" r="158.21"/></clipPath><clipPath id="socp-a-1"><circle cx="362.84" cy="290.03" r="158.21"/></clipPath><clipPath id="socp-a-2"><circle cx="187.05" cy="114.17" r="158.21"/></clipPath><g clip-path="url(#socp-a-1)"><g clip-path="url(#socp-a-2)"><circle cx="99.16" cy="290.03" r="158.21" fill="#f2c9b4"/></g></g><g clip-path="url(#socp-a)"><circle cx="99.16" cy="290.03" r="158.21" fill="none" stroke="#315c48" stroke-width="1.5"/><circle cx="362.84" cy="290.03" r="158.21" fill="none" stroke="#315c48" stroke-width="1.5"/><circle cx="187.05" cy="114.17" r="158.21" fill="none" stroke="#315c48" stroke-width="1.5"/></g><rect x="93.16" y="284.03" width="12" height="12" fill="#24406b"/><text x="109.2" y="282.0">A</text><rect x="356.84" y="284.03" width="12" height="12" fill="#24406b"/><text x="372.8" y="282.0">B</text><rect x="181.05" y="108.17" width="12" height="12" fill="#24406b"/><text x="197.1" y="106.2">C</text><circle cx="216.35" cy="231.41" r="5" fill="#56645b"/><text x="206.4" y="236.4" class="tick" text-anchor="end">重心</text><text x="20.0" y="362.0" class="note">橙の領域：3集落すべてに届く位置</text><text x="20.0" y="386.0" class="note">重心から最も遠いBまで 3.590 km</text><text x="20.0" y="430.0" class="title">半径 √10 ≈ 3.162 km</text><clipPath id="socp-b"><rect x="64.0" y="443.0" width="334.0" height="255.0"/></clipPath><rect x="64.0" y="443.0" width="334.0" height="255.0" fill="#ffffff" stroke="#aab4ab"/><clipPath id="socp-b-0"><circle cx="99.16" cy="654.03" r="138.97"/></clipPath><clipPath id="socp-b-1"><circle cx="362.84" cy="654.03" r="138.97"/></clipPath><clipPath id="socp-b-2"><circle cx="187.05" cy="478.17" r="138.97"/></clipPath><g clip-path="url(#socp-b-1)"><g clip-path="url(#socp-b-2)"><circle cx="99.16" cy="654.03" r="138.97" fill="#f2c9b4"/></g></g><g clip-path="url(#socp-b)"><circle cx="99.16" cy="654.03" r="138.97" fill="none" stroke="#315c48" stroke-width="1.5"/><circle cx="362.84" cy="654.03" r="138.97" fill="none" stroke="#315c48" stroke-width="1.5"/><circle cx="187.05" cy="478.17" r="138.97" fill="none" stroke="#315c48" stroke-width="1.5"/></g><rect x="93.16" y="648.03" width="12" height="12" fill="#24406b"/><text x="109.2" y="646.0">A</text><rect x="356.84" y="648.03" width="12" height="12" fill="#24406b"/><text x="372.8" y="646.0">B</text><rect x="181.05" y="472.17" width="12" height="12" fill="#24406b"/><text x="197.1" y="470.2">C</text><path d="M231.00 610.07L175.41 628.61" stroke="#b3532d" stroke-width="3"/><circle cx="175.41" cy="628.61" r="3.5" fill="#b3532d"/><text x="167.4" y="646.6" class="tick" text-anchor="end">1/3</text><path d="M231.00 610.07L300.49 633.24" stroke="#b3532d" stroke-width="3"/><circle cx="300.49" cy="633.24" r="3.5" fill="#b3532d"/><text x="308.5" y="651.2" class="tick">5/12</text><path d="M231.00 610.07L217.10 568.36" stroke="#b3532d" stroke-width="3"/><circle cx="217.10" cy="568.36" r="3.5" fill="#b3532d"/><text x="209.1" y="562.4" class="tick" text-anchor="end">1/4</text><circle cx="231.00" cy="610.07" r="6" fill="#b3532d"/><text x="20.0" y="724.0" class="note">円が1点 (3, 1) だけで重なる</text><text x="20.0" y="748.0" class="note">矢印の長さは重み。3本の和は0</text></svg>
