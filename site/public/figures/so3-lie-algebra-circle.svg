<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">平面の回転は円、リー代数は接線</title><desc id="figure-description">平面の回転行列 [[a, −b], [b, a]] を点 (a, b) で表した図。回転は半径1の円の上に並び、単位行列 I は (1, 0)。I での接線の点 I+θJ は円の外にあり、θ=1 の I+J は (1, 1)、行列式 2。exp(θJ) は接線を円に巻き付けた点で、θ=1 の exp(J) は (0.540, 0.841)、I からの弧の長さは 1。目盛り 0.5, 1, 1.5, 2 は接線と円で同じ長さに対応する。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="520" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">平面の回転は円、リー代数は接線</text><path d="M30 290.0H430M150.0 52V408" stroke="#aab4ab"/><text x="430.0" y="282.0" class="tick" text-anchor="end">a</text><text x="158.0" y="64.0" class="tick">b</text><circle cx="150.0" cy="290.0" r="100.0" fill="none" stroke="#315c48" stroke-width="2"/><path d="M250.0 65.0V350.0" stroke="#b3532d" stroke-width="2.5"/><text x="260.0" y="71.0">接線 θJ</text><path d="M250.0 290.0A100.0 100.0 0 0 0 204.03 205.85" fill="none" stroke="#24406b" stroke-width="5"/><path d="M244.0 240.0H256.0" stroke="#b3532d"/><text x="262.0" y="245.0" class="tick">0.5</text><circle cx="237.76" cy="242.06" r="3.5" fill="#24406b"/><text x="220.2" y="256.6" class="tick" text-anchor="middle">0.5</text><path d="M244.0 190.0H256.0" stroke="#b3532d"/><text x="262.0" y="195.0" class="tick">1</text><circle cx="204.03" cy="205.85" r="3.5" fill="#24406b"/><text x="193.2" y="227.7" class="tick" text-anchor="middle">1</text><path d="M244.0 140.0H256.0" stroke="#b3532d"/><text x="262.0" y="145.0" class="tick">1.5</text><circle cx="157.07" cy="190.25" r="3.5" fill="#24406b"/><text x="155.7" y="215.2" class="tick" text-anchor="middle">1.5</text><path d="M244.0 90.0H256.0" stroke="#b3532d"/><text x="262.0" y="95.0" class="tick">2</text><circle cx="108.39" cy="199.07" r="3.5" fill="#24406b"/><text x="116.7" y="222.3" class="tick" text-anchor="middle">2</text><circle cx="250.0" cy="290.0" r="6" fill="#17211b"/><text x="262.0" y="312.0">I</text><circle cx="250.0" cy="190.0" r="7" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="282.0" y="195.0">I+J</text><circle cx="204.03" cy="205.85" r="7" fill="#24406b" stroke="#17211b" stroke-width="1.5"/><text x="218.6" y="183.1" text-anchor="middle">exp(J)</text><text x="20.0" y="438.0">点 (a, b) は回転行列 [a −b; b a] を表す</text><text x="20.0" y="464.0">接線の上は自由に動けるが、円の外（回転でない）</text><text x="20.0" y="490.0">exp は接線を円に巻き付ける：長さ θ → θ rad 回す</text><text x="20.0" y="514.0" class="note">θ=1：I+J は行列式 2、exp(J) は弧の長さ 1</text></svg>
