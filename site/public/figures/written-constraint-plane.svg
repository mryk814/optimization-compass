<svg xmlns="http://www.w3.org/2000/svg" width="440" height="478" viewBox="0 0 440 478" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">ありうる値と、ツールが計算できる値</title><desc id="figure-description">流出口の面積 a と流入量 q（どちらも×10⁻⁴）の平面。緑は、ありうる値 a≥0、q≥0。赤は、30分のうちにタンクが空になり、ツールが失敗する値で、q=0 の線の上でも a が 2.51×10⁻⁴ より大きければ失敗する。どちらでもない白い部分は、ツールが値を返すのにありえない値。白抜きの丸は fmin の13回目と14回目で、q が負なのに計算された。×は fmin の15回目と、下限0の Nelder–Mead の15回目で、ツールが失敗した。◆は、失敗した点に100を返した BFGS の答えで、a も q も負。●は記録を作った値の近くの答え。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="478" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">ありうる値と、ツールが計算できる値</text><rect x="121.7" y="70.0" width="288.3" height="126.4" fill="#91b8a4" fill-opacity="0.35"/><polygon points="64.00,386.00 64.00,379.39 65.69,377.36 67.37,375.34 69.06,373.33 70.74,371.32 72.43,369.32 74.12,367.32 75.80,365.33 77.49,363.34 79.17,361.36 80.86,359.38 82.55,357.42 84.23,355.45 85.92,353.49 87.60,351.54 89.29,349.59 90.98,347.65 92.66,345.72 94.35,343.79 96.03,341.87 97.72,339.95 99.41,338.04 101.09,336.14 102.78,334.24 104.46,332.35 106.15,330.47 107.84,328.59 109.52,326.72 111.21,324.85 112.89,322.99 114.58,321.14 116.27,319.30 117.95,317.46 119.64,315.63 121.32,313.81 123.01,311.99 124.70,310.18 126.38,308.38 128.07,306.58 129.75,304.79 131.44,303.01 133.13,301.24 134.81,299.48 136.50,297.72 138.18,295.97 139.87,294.23 141.56,292.49 143.24,290.76 144.93,289.05 146.61,287.34 148.30,285.63 149.99,283.94 151.67,282.25 153.36,280.58 155.04,278.91 156.73,277.25 158.42,275.60 160.10,273.95 161.79,272.32 163.47,270.69 165.16,269.08 166.85,267.47 168.53,265.88 170.22,264.29 171.90,262.71 173.59,261.14 175.28,259.58 176.96,258.03 178.65,256.50 180.33,254.97 182.02,253.45 183.71,251.94 185.39,250.44 187.08,248.96 188.76,247.48 190.45,246.02 192.14,244.5