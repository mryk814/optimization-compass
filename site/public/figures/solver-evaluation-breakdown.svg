<svg xmlns="http://www.w3.org/2000/svg" width="440" height="334" viewBox="0 0 440 334" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">反復9回の裏の評価54回</title><desc id="figure-description">a と q の上下限を 0.00001 から 0.001 にした L-BFGS-B が、ツールを呼んだ順に四角を並べる。列は勾配を求めた点 18 個で、評価の順に左から並ぶ。一段目は初期点 1 個、受け入れた反復点 9 個、直線探索の途中の点 8 個。二段目と三段目は、勾配を差分で作るために a と q を 1e-8 ずらした点 36 個。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="334" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">反復9回の裏の評価54回</text><rect x="25.0" y="92.0" width="9" height="9" rx="2" fill="#56645b" stroke="#17211b" stroke-width="1"/><rect x="25.0" y="103.5" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="25.0" y="115.0" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="36.5" y="92.0" width="9" height="9" rx="2" fill="#315c48" stroke="#17211b" stroke-width="1"/><rect x="36.5" y="103.5" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="36.5" y="115.0" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="48.0" y="92.0" width="9" height="9" rx="2" fill="#91b8a4" stroke="#17211b" stroke-width="1"/><rect x="48.0" y="103.5" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="48.0" y="115.0" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="59.5" y="92.0" width="9" height="9" rx="2" fill="#91b8a4" stroke="#17211b" stroke-width="1"/><rect x="59.5" y="103.5" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="59.5" y="115.0" width="9" height="9" rx="2" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><rect x="71.0" y="92.0" width="9" height="9" rx="2" fill="#91b