<svg xmlns="http://www.w3.org/2000/svg" width="440" height="332" viewBox="0 0 440 332" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">熱源を変えると、温度と目的が動く</title><desc id="figure-description">内部2点の離散温度を三つの熱源で比べる。目的の合計は q=4.5 で 0.50 と最小で、q=0 と q=9 は 1.00。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="332" rx="14" fill="#f7f8f3"/><text x="20" y="26" class="title">熱源を変えると、温度と目的が動く</text><text x="40" y="50" style="font-weight:700">温度 u（内部2点）</text><text x="262" y="50" style="font-weight:700">目的の合計</text><path d="M40 240H220" stroke="#aab4ab"/><line x1="40" y1="115" x2="220" y2="115" stroke="#56645b" stroke-dasharray="5 4"/><text x="40" y="106" class="tick">目標 1</text><polyline points="40.0,240.0 100.0,240.0 160.0,240.0 220.0,240.0" fill="none" stroke="#aab4ab" stroke-width="3"/><polyline points="40.0,240.0 100.0,177.5 160.0,177.5 220.0,240.0" fill="none" stroke="#315c48" stroke-width="3"/><polyline points="40.0,240.0 100.0,115.0 160.0,115.0 220.0,240.0" fill="none" stroke="#b3532d" stroke-width="3"/><path d="M262 240H430" stroke="#aab4ab"/><rect x="272.0" y="90.0" width="36" height="150.0" fill="#24406b" fill-opacity=".85"/><text x="290.0" y="84.0" text-anchor="middle">1.00</text><rect x="327.0" y="202.5" width="36" height="37.5" fill="#24406b" fill-opacity=".85"/><rect x="327.0" y="165.0" width="36" height="37.5" fill="#b3532d" fill-opacity=".85"/><text x="345.0" y="159.0" text-anchor="middle">0.50</text><rect x="382.0" y="90.0" width="36" height="150.0" fill="#b3532d" fill-opacity=".85"/><text x="400.0" y="84.0" text-anchor="middle">1.00</text><text x="290" y="258" class="tick" text-anchor="middle">q=0</text><text x="345" y="258" class="tick" text-anchor="middle">q=4.5</text><text x="400" y="258" class="tick" text-anchor="middle">q=9</text><text x="345" y="150" text-anchor="middle" style="font-weight:700;fill:#315c48">最小</text><rect x="40" y="274" width="22" height="4" fill="#aab4ab"/><text x="70" y="282">q = 0</text><rect x="40" y="292" width="22" height="4" fill="#315c48"/><text x="70" y="300">q = 4.5</text><rect x="40" y="310" width="22" height="4" fill="#b3532d"/><text x="70" y="318">q = 9</text><rect x="262" y="274" width="12" height="12" fill="#24406b"/><text x="282" y="285">温度のずれ</text><rect x="262" y="294" width="12" height="12" fill="#b3532d"/><text x="282" y="305">熱源の罰則</text><text x="262" y="322" class="note">q を強くすると u は動くが罰則が増える。</text></svg>
