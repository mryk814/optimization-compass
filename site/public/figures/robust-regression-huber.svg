<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">傾きを抑えると、釣合いが変わる</title><desc id="figure-description">「残差 r と損失の傾き」は、二乗が r のまま増え、Huber（δ=1）は±1で頭打ちです。「各解での、四観測の勾配への寄与」は観測 (0, 0, 0, 10) について、二乗の解 x=2.5 では 2.5, 2.5, 2.5, −7.5、Huberの解 x=1/3 では 1/3, 1/3, 1/3, −1 となり、どちらも合計は0です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="560" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">傾きを抑えると、釣合いが変わる</text><text x="20.0" y="60.0">① 残差 r と損失の傾き</text><path d="M64 80V220H420" fill="none" stroke="#aab4ab"/><path d="M64 150.0H420" stroke="#aab4ab" stroke-width="1"/><path d="M182.7 80V220" stroke="#aab4ab" stroke-width="1" stroke-dasharray="3 4"/><path d="M301.3 80V220" stroke="#aab4ab" stroke-width="1" stroke-dasharray="3 4"/><text x="56.0" y="225.0" class="tick" text-anchor="end">−3</text><text x="64.0" y="240.0" class="tick" text-anchor="middle">−3</text><text x="56.0" y="155.0" class="tick" text-anchor="end">0</text><text x="242.0" y="240.0" class="tick" text-anchor="middle">0</text><text x="56.0" y="85.0" class="tick" text-anchor="end">3</text><text x="420.0" y="240.0" class="tick" text-anchor="middle">3</text><text x="420.0" y="262.0" class="tick" text-anchor="end">残差 r</text><polyline points="64.00,220.00 420.00,80.00" fill="none" stroke="#24406b" stroke-width="3" stroke-linejoin="round"/><polyline points="64.00,173.33 182.67,173.33 301.33,126.67 420.00,126.67" fill="none" stroke="#b3532d" stroke-width="3" stroke-linejoin="round"/><text style="fill:#24406b" x="72.0" y="100.0">二乗の傾き r</text><text style="fill:#b3532d" x="420.0" y="148.7" text-anchor="end">Huber（δ=1）</text><text x="20.0" y="300.0">② 各解での、四観測の勾配への寄与</text><path d="M64 330V470H420" fill="none" stroke="#aab4ab"/><path d="M64 375.2H420" stroke="#aab4ab" stroke-width="1"/><text x="56.0" y="425.3" class="tick" text-anchor="end">−5</text><text x="56.0" y="380.2" class="tick" text-anchor="end">0</text><text x="56.0" y="335.0" class="tick" text-anchor="end">5</text><text x="108.5" y="490.0" class="tick" text-anchor="middle">0①</text><rect x="80.5" y="352.6" width="26.0" height="22.6" fill="#24406b"/><text x="93.5" y="346.6" class="tick" text-anchor="middle">2.5</text><rect x="110.5" y="372.2" width="26.0" height="3.0" fill="#b3532d"/><text x="123.5" y="366.2" class="tick" text-anchor="middle">1/3</text><text x="197.5" y="490.0" class="tick" text-anchor="middle">0②</text><rect x="169.5" y="352.6" width="26.0" height="22.6" fill="#24406b"/><text x="182.5" y="346.6" class="tick" text-anchor="middle">2.5</text><rect x="199.5" y="372.2" width="26.0" height="3.0" fill="#b3532d"/><text x="212.5" y="366.2" class="tick" text-anchor="middle">1/3</text><text x="286.5" y="490.0" class="tick" text-anchor="middle">0③</text><rect x="258.5" y="352.6" width="26.0" height="22.6" fill="#24406b"/><text x="271.5" y="346.6" class="tick" text-anchor="middle">2.5</text><rect x="288.5" y="372.2" width="26.0" height="3.0" fill="#b3532d"/><text x="301.5" y="366.2" class="tick" text-anchor="middle">1/3</text><text x="375.5" y="490.0" class="tick" text-anchor="middle">10</text><rect x="347.5" y="375.2" width="26.0" height="67.7" fill="#24406b"/><text x="360.5" y="458.9" class="tick" text-anchor="middle">−7.5</text><rect x="377.5" y="375.2" width="26.0" height="9.0" fill="#b3532d"/><text x="390.5" y="400.2" class="tick" text-anchor="middle">−1</text><rect x="20" y="504" width="20" height="12" fill="#24406b"/><text x="48.0" y="515.0">二乗の解 x=2.5</text><rect x="230" y="504" width="20" height="12" fill="#b3532d"/><text x="258.0" y="515.0">Huberの解 x=1/3</text><text x="20.0" y="546.0" class="note">どちらの解でも、四つの寄与の和は0</text></svg>
