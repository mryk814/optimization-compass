<svg xmlns="http://www.w3.org/2000/svg" width="440" height="394" viewBox="0 0 440 394" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">RK45 で解いた二乗和の、式からのずれ</title><desc id="figure-description">流入量 q を 0.000501 に固定し、流出口の面積 a を0.00031から0.00049まで動かす。縦軸は、solve_ivp の既定（RK45、rtol=1e-3）で解いた二乗和から、細かい許容誤差で解いた二乗和を引いた値（×10⁻⁵）。線は、右辺を計算した回数が同じ範囲ごとに切れている。回数は50・62・68・74・80・86回と増える。a=3.289×10⁻⁴ で −6.79×10⁻⁵、a=4.467×10⁻⁴ で −1.23×10⁻⁵の段差がある。ほかの3か所では、線は折れるが跳ばない。答えの a=0.000401 は、回数68回の範囲の中にある。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="394" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">RK45 で解いた二乗和の、式からのずれ</text><path d="M64 70V290H410" fill="none" stroke="#aab4ab"/><path d="M64 131.1H410" stroke="#aab4ab" stroke-dasharray="5 4"/><text x="56.0" y="258.3" class="tick" text-anchor="end">−20</text><text x="56.0" y="197.2" class="tick" text-anchor="end">−10</text><text x="56.0" y="136.1" class="tick" text-anchor="end">0</text><text x="56.0" y="75.0" class="tick" text-anchor="end">10</text><text x="83.2" y="312.0" class="tick" text-anchor="middle">3.2</text><text x="160.1" y="312.0" class="tick" text-anchor="middle">3.6</text><text x="237.0" y="312.0" class="tick" text-anchor="middle">4.0</text><text x="313.9" y="312.0" class="tick" text-anchor="middle">4.4</text><text x="390.8" y="312.0" class="tick" text-anchor="middle">4.8</text><path d="M100.3 70V290" stroke="#c23a2b" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M326.7 70V290" stroke="#c23a2b" stroke-width="1.5" stroke-dasharray="3 3"/><polyline points="64.00,280.38 65.92,274.27 67.84,268.24 69.77,262.32 71.69,256.48 73.61,250.76 75.53,245.11 77.46,239.54 79.38,234.05 81.30,228.65 83.22,223.34 85.14,218.10 87.07,212.91 88.99,207.76 90.91,202.63 92.83,197.50 94.76,192.30 96.68,186.89 98.60,180.95" f