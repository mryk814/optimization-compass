<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">1人を決めると、残りが芋づる式に決まる</title><desc id="figure-description">決まりの節だけで単位伝播した結果。① Cを呼ぶと、店番で¬A、鍵でB、車でD、店番で¬E。② Eを呼ぶと、店番で¬D、車で¬B、鍵でA、店番で¬C。CとEは両方は呼べない。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="330" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">1人を決めると、残りが芋づる式に決まる</text><text x="20.0" y="64.0">① Cを呼ぶと</text><rect x="30.0" y="86" width="60" height="44" rx="10" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><text x="60.0" y="115.0" text-anchor="middle">C</text><rect x="110.0" y="86" width="60" height="44" rx="10" fill="#ffffff" stroke="#56645b" stroke-width="2.5"/><text x="140.0" y="115.0" text-anchor="middle">¬A</text><path d="M90.0 108H106.0" stroke="#aab4ab" stroke-width="2"/><text x="100.0" y="156.0" class="tick" text-anchor="middle">店番</text><rect x="190.0" y="86" width="60" height="44" rx="10" fill="#ffffff" stroke="#24406b" stroke-width="2.5"/><text x="220.0" y="115.0" text-anchor="middle">B</text><path d="M170.0 108H186.0" stroke="#aab4ab" stroke-width="2"/><text x="180.0" y="156.0" class="tick" text-anchor="middle">鍵</text><rect x="270.0" y="86" width="60" height="44" rx="10" fill="#ffffff" stroke="#24406b" stroke-width="2.5"/><text x="300.0" y="115.0" text-anchor="middle">D</text><path d="M250.0 108H266.0" stroke="#aab4ab" stroke-width="2"/><text x="260.0" y="156.0" class="tick" text-anchor="middle">車</text><rect x="350.0" y="86" width="60" height="44" rx="10" fill="#ffffff" stroke="#56645b" stroke-width="2.5"/><text x="380.0" y="115.0" text-anchor="middle">¬E</text><path d="M330.0 108H346.0" stroke="#aab4ab" stroke-width="2"/><text x="340.0" y="156.0" class="tick" text-anchor="middle">店番</text><text x="20.0" y="194.0">② Eを呼ぶと</text><rect x="30.0" y="216" width="60" height="44" rx="10" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><text x="60.0" y="245.0" text-anchor="middle">E</text><rect x="110.0" y="216" width="60" height="44" rx="10" fill="#ffffff" stroke="#56645b" stroke-width="2.5"/><text x="140.0" y="245.0" text-anchor="middle">¬D</text><path d="M90.0 238H106.0" stroke="#aab4ab" stroke-width="2"/><text x="100.0" y="286.0" class="tick" text-anchor="middle">店番</text><rect x="190.0" y="216" width="60" height="44" rx="10" fill="#ffffff" stroke="#56645b" stroke-width="2.5"/><text x="220.0" y="245.0" text-anchor="middle">¬B</text><path d="M170.0 238H186.0" stroke="#aab4ab" stroke-width="2"/><text x="180.0" y="286.0" class="tick" text-anchor="middle">車</text><rect x="270.0" y="216" width="60" height="44" rx="10" fill="#ffffff" stroke="#24406b" stroke-width="2.5"/><text x="300.0" y="245.0" text-anchor="middle">A</text><path d="M250.0 238H266.0" stroke="#aab4ab" stroke-width="2"/><text x="260.0" y="286.0" class="tick" text-anchor="middle">鍵</text><rect x="350.0" y="216" width="60" height="44" rx="10" fill="#ffffff" stroke="#56645b" stroke-width="2.5"/><text x="380.0" y="245.0" text-anchor="middle">¬C</text><path d="M330.0 238H346.0" stroke="#aab4ab" stroke-width="2"/><text x="340.0" y="286.0" class="tick" text-anchor="middle">店番</text><text x="20.0" y="316.0" class="tick">¬A は「Aを呼ばない」。下の文字は使った決まり</text></svg>
