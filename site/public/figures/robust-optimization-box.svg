<svg xmlns="http://www.w3.org/2000/svg" width="440" height="660" viewBox="0 0 440 660" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">含有量の範囲と、袋数の選び方</title><desc id="figure-description">① 1袋あたりの窒素の範囲：化成肥料1.8〜2.2kg、堆肥0.5〜1.5kg。中央は (2, 1)、どちらも少ない角は (1.8, 0.5)。② 袋数の平面：化成肥料 x₁ と堆肥 x₂。中央の含有量で窒素10kgの線、少ない角の含有量で窒素10kgの線、8袋の線。中央の含有量で最も安い (2, 6) は13.2千円だが、少ない角では窒素6.6kg。範囲のどこでも10kgを守る最も安い組み合わせは(5.56, 0)で16.67千円。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="660" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">含有量の範囲と、袋数の選び方</text><text x="20.0" y="64.0">① 1袋あたりの窒素（kg）の範囲</text><path d="M96 84V236H400" fill="none" stroke="#aab4ab"/><text x="146.7" y="256.0" class="tick" text-anchor="middle">1.8</text><text x="248.0" y="256.0" class="tick" text-anchor="middle">2</text><text x="349.3" y="256.0" class="tick" text-anchor="middle">2.2</text><text x="88.0" y="219.3" class="tick" text-anchor="end">0.5</text><text x="88.0" y="165.0" class="tick" text-anchor="end">1</text><text x="88.0" y="110.7" class="tick" text-anchor="end">1.5</text><text x="400.0" y="280.0" class="tick" text-anchor="end">化成肥料 a₁</text><text x="104.0" y="100.0" class="tick">堆肥 a₂</text><rect x="146.7" y="105.7" width="202.7" height="108.6" fill="#e3ece6" stroke="#315c48" stroke-width="2"/><circle cx="248.0" cy="160.0" r="7" fill="#24406b"/><text x="260.0" y="165.0">中央 (2, 1)</text><circle cx="146.7" cy="214.3" r="7" fill="#b3532d"/><text style="fill:#b3532d" x="158.7" y="206.3">少ない角 (1.8, 0.5)</text><text x="20.0" y="318.0">② 袋数の平面</text><text x="410.0" y="318.0" class="tick" text-anchor="end">縦：堆肥 x₂（袋）</text><path d="M76 348V584H410" fill="none" stroke="#aab4ab"/><text x="76.0" y="604.0" class="tick" text-anchor="middle">0</text><text x="68.0" y="589.0" class="tick" text-anchor="end">0</text><text x="159.5" y="604.0" class="tick" text-anchor="middle">2</text><text x="68.0" y="530.0" class="tick" text-anchor="end">2</text><text x="243.0" y="604.0" class="tick" text-anchor="middle">4</text><text x="68.0" y="471.0" class="tick" text-anchor="end">4</text><text x="326.5" y="604.0" class="tick" text-anchor="middle">6</text><text x="68.0" y="412.0" class="tick" text-anchor="end">6</text><text x="410.0" y="604.0" class="tick" text-anchor="middle">8</text><text x="68.0" y="353.0" class="tick" text-anchor="end">8</text><text x="410.0" y="628.0" class="tick" text-anchor="end">化成肥料 x₁（袋）</text><polygon points="307.9,584.0 410.0,584.0 268.7,484.2" fill="#f3d2b5" stroke="none"/><polyline points="76.00,348.00 410.00,584.00" fill="none" stroke="#56645b" stroke-width="2" stroke-linejoin="round"/><polyline points="284.75,584.00 117.75,348.00" fill="none" stroke="#24406b" stroke-width="2.5" stroke-linejoin="round"/><polyline points="307.94,584.00 215.17,348.00" fill="none" stroke="#b3532d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="159.5" cy="407.0" r="7" fill="#24406b" stroke="#17211b" stroke-width="1.5"/><text x="171.5" y="399.0">(2, 6)：13.2千円</text><circle cx="307.9" cy="584.0" r="7" fill="#b3532d" stroke="#17211b" stroke-width="1.5"/><text x="410.0" y="365.7" text-anchor="end">橙の点 (5.56, 0)</text><text x="410.0" y="387.7" text-anchor="end">16.67千円</text><polyline points="20.00,641.00 42.00,641.00" fill="none" stroke="#24406b" stroke-width="2.5" stroke-linejoin="round"/><text x="48.0" y="646.0" class="tick">中央で10kg</text><polyline points="152.00,641.00 174.00,641.00" fill="none" stroke="#b3532d" stroke-width="2.5" stroke-linejoin="round"/><text x="180.0" y="646.0" class="tick">少ない角で10kg</text><polyline points="312.00,641.00 334.00,641.00" fill="none" stroke="#56645b" stroke-width="2" stroke-linejoin="round"/><text x="340.0" y="646.0" class="tick">8袋</text></svg>
