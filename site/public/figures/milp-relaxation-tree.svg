<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">手で指定した5個のLP緩和</title><desc id="figure-description">最大化の例の分枝木です。根のLP緩和は(3, 1.5)で上界21。x2を1以下と2以上に分け、x2が1以下の枝をさらにx1が3以下と4以上に分けます。葉の値は19、20、18で、整数解(4, 0)の利益20が最良です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="430" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">手で指定した5個のLP緩和</text><path d="M220 130L134 168" stroke="#24406b" stroke-width="2"/><path d="M220 130L350 168" stroke="#24406b" stroke-width="2"/><path d="M134 248L68 286" stroke="#24406b" stroke-width="2"/><path d="M134 248L200 286" stroke="#24406b" stroke-width="2"/><rect x="135.0" y="50" width="170" height="80" rx="8" fill="#ffffff" stroke="#24406b" stroke-width="1.5"/><text x="220.0" y="73.0" text-anchor="middle">整数条件を外す</text><text x="220.0" y="97.0" text-anchor="middle">(3, 1.5)</text><text x="220.0" y="120.0" class="note" text-anchor="middle">上界 21</text><rect x="64.0" y="168" width="140" height="80" rx="8" fill="#ffffff" stroke="#24406b" stroke-width="1.5"/><text x="134.0" y="191.0" text-anchor="middle">x₂ ≤ 1</text><text x="134.0" y="215.0" text-anchor="middle">(10/3, 1)</text><text x="134.0" y="238.0" class="note" text-anchor="middle">上界 62/3</text><rect x="280.0" y="168" width="140" height="80" rx="8" fill="#ffffff" stroke="#24406b" stroke-width="1.5"/><text x="350.0" y="191.0" text-anchor="middle">x₂ ≥ 2</text><text x="350.0" y="215.0" text-anchor="middle">(2, 2)</text><text x="350.0" y="238.0" class="note" text-anchor="middle">上界 18</text><rect x="6.0" y="286" width="124" height="80" rx="8" fill="#ffffff" stroke="#24406b" stroke-width="1.5"/><text x="68.0" y="309.0" text-anchor="middle">x₁ ≤ 3</text><text x="68.0" y="333.0" text-anchor="middle">(3, 1)</text><text x="68.0" y="356.0" class="note" text-anchor="middle">値 19</text><rect x="138.0" y="286" width="124" height="80" rx="8" fill="#fbeee6" stroke="#b3532d" stroke-width="3"/><text x="200.0" y="309.0" text-anchor="middle">x₁ ≥ 4</text><text x="200.0" y="333.0" text-anchor="middle">(4, 0)</text><text x="200.0" y="356.0" class="note" text-anchor="middle">値 20</text><text x="20.0" y="392.0">橙の枠：整数解 (4, 0)、利益20</text><text x="20.0" y="416.0" class="note">葉の19、20、18は、どれも20以下</text></svg>
