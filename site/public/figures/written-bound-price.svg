<svg xmlns="http://www.w3.org/2000/svg" width="440" height="428" viewBox="0 0 440 428" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">答えは書いた下限に沿って動く</title><desc id="figure-description">炭素の量 c（0〜0.00011）を横軸に、その c で温度を最適にしたときの費用 F を描いた図。F はほぼ直線で、傾きは約4927。下限を 1e−6、1e−5、1e−4 にした答えは、それぞれ F=0.1944、0.2387、0.6823。c=0 ではツールがエラーになるので、F は 0.1895 に近づくが届かない。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="428" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">答えは書いた下限に沿って動く</text><path d="M64 64V300H416" fill="none" stroke="#aab4ab" stroke-width="1.5"/><path d="M64 280.3H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="56.0" y="285.3" class="tick" text-anchor="end">0.2</text><path d="M64 201.7H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="56.0" y="206.7" class="tick" text-anchor="end">0.4</text><path d="M64 123.0H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="56.0" y="128.0" class="tick" text-anchor="end">0.6</text><text x="64.0" y="320.0" class="tick" text-anchor="middle">0</text><text x="128.0" y="320.0" class="tick" text-anchor="middle">2</text><text x="192.0" y="320.0" class="tick" text-anchor="middle">4</text><text x="256.0" y="320.0" class="tick" text-anchor="middle">6</text><text x="320.0" y="320.0" class="tick" text-anchor="middle">8</text><text x="384.0" y="320.0" class="tick" text-anchor="middle">10</text><text x="416.0" y="342.0" class="tick" text-anchor="end">炭素の量 c（×10⁻⁵）</text><text x="20.0" y="52.0" class="tick">費用 F</text><polyline points="69.87,280.92 75.73,277.37 81.60,273.82 87.47,270.26 93.33,266.71 99.20,263.16 105.07,259.60 110.93,256.05 116.80,252.50 122.67,248.95 128.53,245.39 134.40,241.84 140.27,238.29 146.13,234.73 152.00,231.18 157.87,227.63 163.73,224.07 169.60,220.52 175.4