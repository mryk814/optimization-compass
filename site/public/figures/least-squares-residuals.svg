<svg xmlns="http://www.w3.org/2000/svg" width="440" height="380" viewBox="0 0 440 380" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">残差の二乗を、面積にする</title><desc id="figure-description">初期の4点と二乗和が最小の直線 y=0.9+0.9t。各点の縦のずれ（残差）を一辺とする正方形の面積が残差の二乗で、面積の合計は 0.70 です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="380" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">残差の二乗を、面積にする</text><path d="M56 52V272H416" fill="none" stroke="#aab4ab"/><text x="86.0" y="292.0" class="tick" text-anchor="middle">0</text><text x="186.0" y="292.0" class="tick" text-anchor="middle">1</text><text x="286.0" y="292.0" class="tick" text-anchor="middle">2</text><text x="386.0" y="292.0" class="tick" text-anchor="middle">3</text><text x="48.0" y="249.5" class="tick" text-anchor="end">1</text><text x="48.0" y="194.5" class="tick" text-anchor="end">2</text><text x="48.0" y="139.5" class="tick" text-anchor="end">3</text><text x="48.0" y="84.5" class="tick" text-anchor="end">4</text><text x="416.0" y="262.0" class="tick" text-anchor="end">時刻 t</text><text x="62.0" y="62.0" class="tick">温度 y</text><polyline points="66.00,259.90 406.00,91.60" fill="none" stroke="#315c48" stroke-width="3" stroke-linejoin="round"/><rect x="86.00" y="244.50" width="5.50" height="5.50" fill="#e8b88b" fill-opacity=".7" stroke="#b3532d"/><path d="M86.00 244.50V250.00" stroke="#b3532d" stroke-width="3"/><circle cx="86.00" cy="244.50" r="6" fill="#24406b"/><rect x="186.00" y="189.50" width="11.00" height="11.00" fill="#e8b88b" fill-opacity=".7" stroke="#b3532d"/><path d="M186.00 189.50V200.50" stroke="#b3532d" stroke-width="3"/><circle cx="186.00" cy="189.50" r="6" fill="#24406b"/><rect x="286.00" y="151.00" width="38.50" height="38.50" fill="#e8b88b" fill-opacity=".7" stroke="#b3532d"/><path d="M286.00 189.50V151.00" stroke="#b3532d" stroke-width="3"/><circle cx="286.00" cy="189.50" r="6" fill="#24406b"/><rect x="386.00" y="79.50" width="22.00" height="22.00" fill="#e8b88b" fill-opacity=".7" stroke="#b3532d"/><path d="M386.00 79.50V101.50" stroke="#b3532d" stroke-width="3"/><circle cx="386.00" cy="79.50" r="6" fill="#24406b"/><text x="20.0" y="324.0">縦のずれ r → 四角の面積 r²</text><text x="20.0" y="348.0">面積の合計を最小にする直線を選ぶ</text><text x="20.0" y="372.0" class="note">この直線では合計 0.70</text></svg>
