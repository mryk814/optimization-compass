<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">どの割当も15分を下回らない理由</title><desc id="figure-description">救急車ごとの値 u=(1, 3, 5) と、通報ごとの値 v=(2, 0, 4) を到着時間から引いた表。すべてのマスが0以上で、合計が最小の割当の3マスは0。そのため、どの割当の合計も u と v の合計 15 分以上になる。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="360" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">どの割当も15分を下回らない理由</text><text x="20.0" y="64.0">時間 − u − v</text><text x="210.0" y="92.0" text-anchor="middle">A v=2</text><text x="294.0" y="92.0" text-anchor="middle">B v=0</text><text x="378.0" y="92.0" text-anchor="middle">C v=4</text><text x="156.0" y="131.0" text-anchor="end">救急車1 u=1</text><rect x="171" y="105.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="210.0" y="131.0" text-anchor="middle">0</text><rect x="255" y="105.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="131.0" text-anchor="middle">1</text><rect x="339" y="105.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="131.0" text-anchor="middle">0</text><text x="156.0" y="177.0" text-anchor="end">救急車2 u=3</text><rect x="171" y="151.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="177.0" text-anchor="middle">5</text><rect x="255" y="151.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="294.0" y="177.0" text-anchor="middle">0</text><rect x="339" y="151.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="378.0" y="177.0" text-anchor="middle">1</text><text x="156.0" y="223.0" text-anchor="end">救急車3 u=5</text><rect x="171" y="197.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="210.0" y="223.0" text-anchor="middle">7</text><rect x="255" y="197.0" width="78" height="40" rx="6" fill="#ffffff" stroke="#aab4ab" stroke-width="1"/><text x="294.0" y="223.0" text-anchor="middle">0</text><rect x="339" y="197.0" width="78" height="40" rx="6" fill="#f3d2b5" stroke="#b3532d" stroke-width="2.5"/><text x="378.0" y="223.0" text-anchor="middle">0</text><text x="20.0" y="266.0">u の合計 9 ＋ v の合計 6 = 15</text><text x="20.0" y="292.0">どの割当も各行・各列を一度ずつ使うので、</text><text x="20.0" y="316.0">合計 ＝ 15 ＋ 選んだマスの値 ≧ 15</text><text x="20.0" y="344.0" class="note">橙の3マスは0なので、合計 15 分が最小</text></svg>
