<svg xmlns="http://www.w3.org/2000/svg" width="440" height="576" viewBox="0 0 440 576" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">4箱目は、A→Bを1箱戻して通す</title><desc id="figure-description">工場Sから店Tへ4箱を送る最小費用流です。各辺の数字は流量/容量と1箱の運賃です。最安の経路S→A→B→T（1箱3）に3箱を送ると費用9で、S→AとB→Tが満杯になります。4箱目はS→B→A→Tを通り、A→Bの流れを1箱減らします。1箱の運賃は4−1+5=8で、合計は17です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="576" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">4箱目は、A→Bを1箱戻して通す</text><defs><marker id="flow-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3532d"/></marker><marker id="flow-head-empty" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#aab4ab"/></marker></defs><text x="20.0" y="64.0">① 最安の経路に3箱</text><text x="420.0" y="64.0" class="note" text-anchor="end">費用 9</text><path d="M61.8 159.3L198.5 108.1" stroke="#b3532d" stroke-width="9.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="122.0" y="108.0" text-anchor="middle">3/3（満杯）</text><text x="122.0" y="127.0" class="tick" text-anchor="middle">運賃1</text><path d="M61.8 172.7L198.5 223.9" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-head-empty)"/><text x="122.0" y="240.0" text-anchor="middle">0/3</text><text x="122.0" y="259.0" class="tick" text-anchor="middle">運賃4</text><path d="M220.0 119.0L220.0 209.0" stroke="#b3532d" stroke-width="9.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="232.0" y="160.0">3/3（満杯）</text><text x="232.0" y="179.0" class="tick">運賃1</text><path d="M237.8 106.7L374.5 157.9" stroke="#aab4ab" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-head-empty)"/><text x="318.0" y="108.0" text-anchor="middle">0/2</text><text x="318.0" y="127.0" class="tick" text-anchor="middle">運賃5</text><path d="M237.8 225.3L374.5 174.1" stroke="#b3532d" stroke-width="9.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="318.0" y="240.0" text-anchor="middle">3/3（満杯）</text><text x="318.0" y="259.0" class="tick" text-anchor="middle">運賃1</text><circle cx="44" cy="166.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="44.0" y="172.0" text-anchor="middle">S</text><circle cx="220" cy="100.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="220.0" y="106.0" text-anchor="middle">A</text><circle cx="220" cy="232.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="220.0" y="238.0" text-anchor="middle">B</text><circle cx="396" cy="166.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="396.0" y="172.0" text-anchor="middle">T</text><text x="20.0" y="304.0">② 4箱目は S→B→A→T</text><text x="420.0" y="304.0" class="note" text-anchor="end">費用 17</text><path d="M61.8 399.3L198.5 348.1" stroke="#b3532d" stroke-width="9.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="122.0" y="348.0" text-anchor="middle">3/3（満杯）</text><text x="122.0" y="367.0" class="tick" text-anchor="middle">運賃1</text><path d="M61.8 412.7L198.5 463.9" stroke="#b3532d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="122.0" y="480.0" text-anchor="middle">1/3</text><text x="122.0" y="499.0" class="tick" text-anchor="middle">運賃4</text><path d="M220.0 359.0L220.0 449.0" stroke="#b3532d" stroke-width="7" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="232.0" y="400.0">2/3</text><text x="232.0" y="419.0" class="tick">運賃1</text><path d="M237.8 346.7L374.5 397.9" stroke="#b3532d" stroke-width="4.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="318.0" y="348.0" text-anchor="middle">1/2</text><text x="318.0" y="367.0" class="tick" text-anchor="middle">運賃5</text><path d="M237.8 465.3L374.5 414.1" stroke="#b3532d" stroke-width="9.5" stroke-linecap="round" marker-end="url(#flow-head)"/><text x="318.0" y="480.0" text-anchor="middle">3/3（満杯）</text><text x="318.0" y="499.0" class="tick" text-anchor="middle">運賃1</text><circle cx="44" cy="406.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="44.0" y="412.0" text-anchor="middle">S</text><circle cx="220" cy="340.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="220.0" y="346.0" text-anchor="middle">A</text><circle cx="220" cy="472.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="220.0" y="478.0" text-anchor="middle">B</text><circle cx="396" cy="406.0" r="19" fill="#ffffff" stroke="#24406b" stroke-width="2"/><text x="396.0" y="412.0" text-anchor="middle">T</text><text x="20.0" y="536.0">辺の数字：流量/容量　橙が太いほど多く流す</text><text x="20.0" y="560.0" class="note">4箱目の運賃 4−1+5=8（A→Bは1箱戻す）</text></svg>
