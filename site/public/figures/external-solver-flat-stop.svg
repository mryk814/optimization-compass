<svg xmlns="http://www.w3.org/2000/svg" width="440" height="478" viewBox="0 0 440 478" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">差分の勾配は、βが0の平らな範囲で止まる</title><desc id="figure-description">Bの分率 x（−0.5〜1）と外側の目的 J=(βの量−0.30)²。x が 0.2 以下では β がなく J=0.09 で平ら、0.7 以上では β だけで J=0.49 で平ら、そのあいだで J=4(x−0.35)² の谷。始点 0.6（J=0.25）から、範囲なしのBFGSは x=−0.41 で、範囲 [0, 1] のL-BFGS-Bは x=0 で、どちらも J=0.09 のまま止まる。範囲 [0, 1] のNelder–Meadは 30 回の計算で x=0.35、J=0 に着く。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="478" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">差分の勾配は、βが0の平らな範囲で止まる</text><rect x="56.0" y="84" width="120.0" height="216" fill="#c23a2b" opacity="0.08"/><rect x="224.0" y="84" width="120.0" height="216" fill="#91b8a4" opacity="0.25"/><text x="116.0" y="74.0" class="tick" text-anchor="middle">組成の外</text><text x="200.0" y="74.0" class="tick" text-anchor="middle">αだけ</text><text x="284.0" y="74.0" class="tick" text-anchor="middle">α+β</text><text x="380.0" y="74.0" class="tick" text-anchor="middle">βだけ</text><path d="M56 84V300H416" fill="none" stroke="#aab4ab" stroke-width="1.5"/><path d="M56 300.0H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="48.0" y="305.0" class="tick" text-anchor="end">0</text><path d="M56 261.1H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="48.0" y="266.1" class="tick" text-anchor="end">0.09</text><path d="M56 192.0H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="48.0" y="197.0" class="tick" text-anchor="end">0.25</text><path d="M56 88.3H416" stroke="#aab4ab" stroke-width="0.6" opacity="0.6"/><text x="48.0" y="93.3" class="tick" text-anchor="end">0.49</text><text x="56.0" y="320.0" class="tick" text-anchor="middle">−0.5</text><text x="176.0" y="320.0" class="tick" text-anchor="middle