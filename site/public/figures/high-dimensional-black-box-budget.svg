<svg xmlns="http://www.w3.org/2000/svg" width="440" height="618" viewBox="0 0 440 618" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">つまみの数と、200回の届き方</title><desc id="figure-description">つまみの数を増やしたとき、200回の評価で何が変わるかを2つのパネルで示します。小箱（全部のつまみが0.5から0.7）に入る点の期待数は、つまみ3本で1.6、4本で0.32です。ランダム探索の最良スコアの中央値は、つまみ2本で0.0005、50本で0.0601です。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="618" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">つまみの数と、200回の届き方</text><text x="20.0" y="62.0">① 小箱に入る点の期待数（200点中）</text><path d="M56 74V224H420" fill="none" stroke="#aab4ab" stroke-width="1.5"/><text x="48.0" y="229.0" text-anchor="end">0.01</text><path d="M52 224.0H420" stroke="#aab4ab" stroke-width="0.8" opacity="0.6"/><text x="48.0" y="154.0" text-anchor="end">1</text><path d="M52 149.0H420" stroke="#aab4ab" stroke-width="0.8" opacity="0.6"/><text x="48.0" y="79.0" text-anchor="end">100</text><path d="M52 74.0H420" stroke="#aab4ab" stroke-width="0.8" opacity="0.6"/><rect x="69.3" y="88.9" width="34" height="135.1" fill="#315c48" opacity="0.85"/><text x="86.3" y="82.9" text-anchor="middle">40</text><text x="86.3" y="246.0" text-anchor="middle">1</text><rect x="130.0" y="115.1" width="34" height="108.9" fill="#315c48" opacity="0.85"/><text x="147.0" y="109.1" text-anchor="middle">8</text><text x="147.0" y="246.0" text-anchor="middle">2</text><rect x="190.7" y="141.3" width="34" height="82.7" fill="#315c48" opacity="0.85"/><text x="207.7" y="135.3" text-anchor="middle">1.6</text><text x="207.7" y="246.0" text-anchor="middle">3</text><rect x="251.3" y="167.6" width="34" height="56.4" fill="#b3532d" opacity="0.85"/><text x="268.3" y="161.6" text-anchor="middle">0.32</text><text x="268.3" y="246.0" text-anchor="middle">4</text><rect x="312.0" y="193.8" width="34" height="30.2"