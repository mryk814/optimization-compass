<svg xmlns="http://www.w3.org/2000/svg" width="440" height="345" viewBox="0 0 440 345" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">希望量から配分へ：引いて、負を0にする</title><desc id="figure-description">三つの活動の希望量 (0.9, 0.3, 0.05) から共通の量 0.1 を引くと確認が負になり、0に切ると合計1の配分 (0.8, 0.2, 0) になる。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="345" rx="14" fill="#f7f8f3"/><text x="20" y="26" class="title">希望量から、配分の三角形へ戻す</text><path d="M40 230.0H420" stroke="#aab4ab"/><line x1="40" y1="215.0" x2="420" y2="215.0" stroke="#56645b" stroke-dasharray="5 4"/><text x="44" y="209.0" class="tick">0.1</text><text x="95.0" y="48" text-anchor="middle" style="font-weight:700">① 希望量</text><text x="95.0" y="66" text-anchor="middle" class="tick">合計 1.25</text><rect x="55.0" y="95.0" width="22" height="135.0" fill="#24406b" fill-opacity=".85"/><text x="66.0" y="89.0" text-anchor="middle" class="tick">0.90</text><rect x="82.0" y="185.0" width="22" height="45.0" fill="#315c48" fill-opacity=".85"/><text x="93.0" y="179.0" text-anchor="middle" class="tick">0.30</text><rect x="109.0" y="222.5" width="22" height="7.5" fill="#b3532d" fill-opacity=".85"/><text x="120.0" y="216.5" text-anchor="middle" class="tick">0.05</text><text x="220.0" y="48" text-anchor="middle" style="font-weight:700">② 各値から 0.1 を引く</text><text x="220.0" y="66" text-anchor="middle" class="tick">合計 0.95（確認は負）</text><rect x="180.0" y="110.0" width="22" height="120.0" fill="#24406b" fill-opacity=".85"/><text x="191.0" y="104.0" text-anchor="middle" class="tick">0.80</text><rect x="207.0" y="200.0" width="22" height="30.0" fill="#315c48" fill-opacity=".85"/><text x="218.0" y="194.0" text-anchor="middle" class="tick">0.20</text><rect x="234.0" y="230.0" width="22" height="7.5" fill="#b3532d" fill-opacity=".85"/><text x="245.0" y="253.5" text-anchor="middle" class="tick">-0.05</text><text x="345.0" y="48" text-anchor="middle" style="font-weight:700">③ 負の値を0にする</text><text x="345.0" y="66" text-anchor="middle" class="tick">合計 1.00</text><rect x="305.0" y="110.0" width="22" height="120.0" fill="#24406b" fill-opacity=".85"/><text x="316.0" y="104.0" text-anchor="middle" class="tick">0.80</text><rect x="332.0" y="200.0" width="22" height="30.0" fill="#315c48" fill-opacity=".85"/><text x="343.0" y="194.0" text-anchor="middle" class="tick">0.20</text><rect x="359.0" y="230.0" width="22" height="0.0" fill="#b3532d" fill-opacity=".85"/><text x="370.0" y="224.0" text-anchor="middle" class="tick">0.00</text><text x="95" y="283" text-anchor="middle" class="tick">調査 制作 確認</text><text x="220" y="283" text-anchor="middle" class="tick">調査 制作 確認</text><text x="345" y="283" text-anchor="middle" class="tick">調査 制作 確認</text><rect x="40" y="296" width="12" height="12" fill="#24406b"/><text x="58" y="307">調査</text><rect x="110" y="296" width="12" height="12" fill="#315c48"/><text x="128" y="307">制作</text><rect x="180" y="296" width="12" height="12" fill="#b3532d"/><text x="198" y="307">確認</text><text x="20" y="332" class="note">θ = 0.1 は、負を0に切ったあとの合計がちょうど1になる値。</text></svg>
