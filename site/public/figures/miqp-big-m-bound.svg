<svg xmlns="http://www.w3.org/2000/svg" width="440" height="524" viewBox="0 0 440 524" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">M の大きさと下界</title><desc id="figure-description">5銘柄から3銘柄以内を選ぶポートフォリオで、big-M の M を変えたときの連続緩和の下界と整数の最適値です。M ＝ 各銘柄の上限では下界102.41、最適値120.75。M ＝ 1では下界97.09、最適値120.75。M ＝ 10では下界92.59、最適値120.75。M ＝ 100では下界92.14、最適値120.75。M ＝ 0.4では下界104.59、最適値125.78。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="524" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">M の大きさと下界</text><path d="M58.10 394V406" stroke="#24406b" stroke-width="2"/><text x="58.1" y="422.0" class="tick" text-anchor="middle">90</text><path d="M148.57 394V406" stroke="#24406b" stroke-width="2"/><text x="148.6" y="422.0" class="tick" text-anchor="middle">100</text><path d="M239.05 394V406" stroke="#24406b" stroke-width="2"/><text x="239.0" y="422.0" class="tick" text-anchor="middle">110</text><path d="M329.52 394V406" stroke="#24406b" stroke-width="2"/><text x="329.5" y="422.0" class="tick" text-anchor="middle">120</text><path d="M420.00 394V406" stroke="#24406b" stroke-width="2"/><text x="420.0" y="422.0" class="tick" text-anchor="middle">130</text><path d="M40 400H420" stroke="#24406b" stroke-width="2"/><text x="420.0" y="446.0" class="tick" text-anchor="end">目的値（分散＋固定費）</text><text x="20.0" y="72.0">M ＝ 各銘柄の上限</text><path d="M58.10 81V99" stroke="#aab4ab" stroke-width="1"/><path d="M148.57 81V99" stroke="#aab4ab" stroke-width="1"/><path d="M239.05 81V99" stroke="#aab4ab" stroke-width="1"/><path d="M329.52 81V99" stroke="#aab4ab" stroke-width="1"/><path d="M420.00 81V99" stroke="#aab4ab" stroke-width="1"/><path d="M170.34 90H336.29" stroke="#24406b" stroke-width="3"/><circle cx="170.34" cy="90" r="7" fill="#b3532d"/><circle cx="336.29" cy="90" r="7" fill="#315c48"/><text x="170.3" y="118.0" text-anchor="middle">102.41</text><text x="336.3" y="118.0" text-anchor="middle">120.75</text><text x="20.0" y="140.0">M ＝ 1</text><path d="M58.10 149V167" stroke="#aab4ab" stroke-width="1"/><path d="M148.57 149V167" stroke="#aab4ab" stroke-width="1"/><path d="M239.05 149V167" stroke="#aab4ab" stroke-width="1"/><path d="M329.52 149V167" stroke="#aab4ab" stroke-width="1"/><path d="M420.00 149V167" stroke="#aab4ab" stroke-width="1"/><path d="M122.24 158H336.29" stroke="#24406b" stroke-width="3"/><circle cx="122.24" cy="158" r="7" fill="#b3532d"/><circle cx="336.29" cy="158" r="7" fill="#315c48"/><text x="122.2" y="186.0" text-anchor="middle">97.09</text><text x="336.3" y="186.0" text-anchor="middle">120.75</text><text x="20.0" y="208.0">M ＝ 10</text><path d="M58.10 217V235" stroke="#aab4ab" stroke-width="1"/><path d="M148.57 217V235" stroke="#aab4ab" stroke-width="1"/><path d="M239.05 217V235" stroke="#aab4ab" stroke-width="1"/><path d="M329.52 217V235" stroke="#aab4ab" stroke-width="1"/><path d="M420.00 217V235" stroke="#aab4ab" stroke-width="1"/><path d="M81.53 226H336.29" stroke="#24406b" stroke-width="3"/><circle cx="81.53" cy="226" r="7" fill="#b3532d"/><circle cx="336.29" cy="226" r="7" fill="#315c48"/><text x="81.5" y="254.0" text-anchor="middle">92.59</text><text x="336.3" y="254.0" text-anchor="middle">120.75</text><text x="20.0" y="276.0">M ＝ 100</text><path d="M58.10 285V303" stroke="#aab4ab" stroke-width="1"/><path d="M148.57 285V303" stroke="#aab4ab" stroke-width="1"/><path d="M239.05 285V303" stroke="#aab4ab" stroke-width="1"/><path d="M329.52 285V303" stroke="#aab4ab" stroke-width="1"/><path d="M420.00 285V303" stroke="#aab4ab" stroke-width="1"/><path d="M77.46 294H336.29" stroke="#24406b" stroke-width="3"/><circle cx="77.46" cy="294" r="7" fill="#b3532d"/><circle cx="336.29" cy="294" r="7" fill="#315c48"/><text x="77.5" y="322.0" text-anchor="middle">92.14</text><text x="336.3" y="322.0" text-anchor="middle">120.75</text><text x="20.0" y="344.0">M ＝ 0.4（上限より小さい別の問題）</text><path d="M58.10 353V371" stroke="#aab4ab" stroke-width="1"/><path d="M148.57 353V371" stroke="#aab4ab" stroke-width="1"/><path d="M239.05 353V371" stroke="#aab4ab" stroke-width="1"/><path d="M329.52 353V371" stroke="#aab4ab" stroke-width="1"/><path d="M420.00 353V371" stroke="#aab4ab" stroke-width="1"/><path d="M190.10 362H381.80" stroke="#24406b" stroke-width="3"/><circle cx="190.10" cy="362" r="7" fill="#b3532d"/><circle cx="381.80" cy="362" r="7" fill="#315c48"/><text x="190.1" y="390.0" text-anchor="middle">104.59</text><text x="381.8" y="390.0" text-anchor="middle">125.78</text><circle cx="28" cy="471" r="7" fill="#b3532d"/><text x="44.0" y="476.0">橙：連続緩和の下界</text><circle cx="28" cy="499" r="7" fill="#315c48"/><text x="44.0" y="504.0">緑：整数の最適値（列挙で確認）</text></svg>
