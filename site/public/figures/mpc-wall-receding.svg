<svg xmlns="http://www.w3.org/2000/svg" width="440" height="392" viewBox="0 0 440 392" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">解き直しと壁</title><desc id="figure-description">台車を位置3から壁（位置0）の手前で止める12歩の計画です。実機の入力の効きはモデルの1.3倍とします。計画を解き直さず最後まで実行すると、位置が-0.90まで進んで壁を越えます。毎回5歩先まで解き直すと、最小の位置は0.019で、壁を越えません。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="392" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">解き直しと壁</text><path d="M64 52V270H420" fill="none" stroke="#aab4ab"/><text x="64.0" y="292.0" class="tick" text-anchor="middle">0</text><text x="182.7" y="292.0" class="tick" text-anchor="middle">4</text><text x="301.3" y="292.0" class="tick" text-anchor="middle">8</text><text x="420.0" y="292.0" class="tick" text-anchor="middle">12</text><text x="56.0" y="265.1" class="tick" text-anchor="end">-1</text><text x="56.0" y="215.5" class="tick" text-anchor="end">0</text><text x="56.0" y="166.0" class="tick" text-anchor="end">1</text><text x="56.0" y="116.5" class="tick" text-anchor="end">2</text><text x="56.0" y="66.9" class="tick" text-anchor="end">3</text><text x="420.0" y="314.0" class="tick" text-anchor="end">歩数</text><text x="70.0" y="62.0" class="tick">位置</text><path d="M64 210.55H420" stroke="#24406b" stroke-width="5"/><polyline points="64.00,61.91 93.67,86.68 123.33,149.65 153.00,201.28 182.67,210.55 212.33,207.91 242.00,209.99 271.67,210.55 301.33,210.54 331.00,210.54 360.67,210.55 390.33,210.55 420.00,210.55" fill="none" stroke="#b3532d" stroke-width="2" stroke-linejoin="round"/><polyline points="64.00,61.91 93.67,94.11 123.33,175.98 153.00,243.09 182.67,255.14 212.33,251.71 242.00,254.42 271.67,255.14 301.33,255.13 331.00,255.13 360.67,255.14 390.33,255.14 420.00,255.14" fill="none" stroke="#56645b" stroke-width="3" stroke-linejoin="round"/><polyline points="64.00,61.91 93.67,94.11 123.33,161.28 153.00,199.00 182.67,206.30 212.33,209.10 242.00,209.54 271.67,209.53 301.33,209.62 331.00,209.45 360.67,209.53 390.33,209.32 420.00,209.41" fill="none" stroke="#315c48" stroke-width="3" stroke-linejoin="round"/><text x="20.0" y="340.0">紺：壁（位置0）　橙：モデル上の計画</text><text x="20.0" y="364.0" class="note">灰：解き直さず実行。12歩後 -0.90（最小 -0.90）</text><text x="20.0" y="388.0" class="note">緑：毎回解き直し。最小 0.019</text></svg>
