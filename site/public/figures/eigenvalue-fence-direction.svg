<svg xmlns="http://www.w3.org/2000/svg" width="440" height="652" viewBox="0 0 440 652" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">塀の向きを変えると、距離の二乗和が波打つ</title><desc id="figure-description">5本の杭と、重心 (4, 3) を通る直線。傾き2の直線（向き 63.4°）で、杭から直線への垂直な距離の二乗和が最小の 2 になる。二乗和は向きとともに 2 と 12 の間を波打ち、縦のずれで当てはめた傾き1の直線（45°）では 3。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="652" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">塀の向きを変えると、距離の二乗和が波打つ</text><text x="20.0" y="64.0">① 杭の位置と塀の線</text><rect x="118.0" y="84.0" width="204" height="204" fill="#ffffff" stroke="#aab4ab"/><text x="118.0" y="308.0" class="tick" text-anchor="middle">1</text><text x="152.0" y="308.0" class="tick" text-anchor="middle">2</text><text x="186.0" y="308.0" class="tick" text-anchor="middle">3</text><text x="220.0" y="308.0" class="tick" text-anchor="middle">4</text><text x="254.0" y="308.0" class="tick" text-anchor="middle">5</text><text x="288.0" y="308.0" class="tick" text-anchor="middle">6</text><text x="322.0" y="308.0" class="tick" text-anchor="middle">7</text><text x="110.0" y="293.0" class="tick" text-anchor="end">0</text><text x="110.0" y="225.0" class="tick" text-anchor="end">2</text><text x="110.0" y="157.0" class="tick" text-anchor="end">4</text><text x="110.0" y="89.0" class="tick" text-anchor="end">6</text><polyline points="169.00,288.00 271.00,84.00" fill="none" stroke="#315c48" stroke-width="3" stroke-linejoin="round"/><path d="M186.0 220.0L199.6 226.8" stroke="#b3532d" stroke-width="3"/><circle cx="186.0" cy="220.0" r="6" fill="#24406b"/><path d="M186.0 186.0L213.2 199.6" stroke="#b3532d" stroke-width="3"/><circle cx="186.0" cy="186.0" r="6" fill="#24406b"/><path d="M220.0 254.0L192.8 240.4" stroke="#b3532d" stroke-width="3"/><circle cx="220.0" cy="254.0" r="6" fill=