<svg xmlns="http://www.w3.org/2000/svg" width="440" height="386" viewBox="0 0 440 386" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">評価の番号と、渡された流入量 q</title><desc id="figure-description">初期点 a=0.0001、q=0.0001 から、SciPy の三通りの使い方で水位の二乗和を最小化したときに、ツールへ渡された流入量 q を評価の番号ごとに描く。fmin（Nelder–Mead）は 13 回目から負の q を渡し、13 回目と 14 回目はエラーにならずに計算された。15 回目は流入量 −0.85×10⁻⁴ でタンクが空になり、ツールが失敗した。q の下限を0にした Nelder–Mead は12回目まで同じ点を通り、13回目からは q=0 を渡し、15 回目に同じく失敗した。minimize の既定（BFGS）は4回目に q=−0.25 を渡して失敗した。BFGS の◆は、重ならないように少し上にずらして描く。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="386" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">評価の番号と、渡された流入量 q</text><path d="M76 128V300H410" fill="none" stroke="#aab4ab"/><text x="68.0" y="305.0" class="tick" text-anchor="end">−1</text><text x="68.0" y="228.6" class="tick" text-anchor="end">0</text><text x="68.0" y="190.3" class="tick" text-anchor="end">0.5</text><text x="68.0" y="152.1" class="tick" text-anchor="end">1</text><text x="76.0" y="322.0" class="tick" text-anchor="middle">1</text><text x="147.6" y="322.0" class="tick" text-anchor="middle">4</text><text x="243.0" y="322.0" class="tick" text-anchor="middle">8</text><text x="338.4" y="322.0" class="tick" text-anchor="middle">12</text><text x="410.0" y="322.0" class="tick" text-anchor="middle">15</text><path d="M76 223.6H410" stroke="#aab4ab" stroke-width="1.5"/><polyline points="76.00,147.11 99.86,147.11 123.71,143.29 147.57,150.93 171.43,154.76 195.29,154.76 219.14,158.58 243.00,166.22 266.86,175.78 290.71,179.60 314.57,192.02 338.43,209.22 362.29,234.54 386.14,250.79 410.00,288.29" fill="none" stroke="#91b8a4" stroke-width="2" stroke-linejoin="round"/><circle cx="76.0" cy="147.1" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="99.9" cy="147.1" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="123.7" cy="143.3" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="147.6" cy="150.9" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="171.4" cy="154.8" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="195.3" cy="154.8" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="219.1" cy="158.6" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="243.0" cy="166.2" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="266.9" cy="175.8" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="290.7" cy="179.6" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="314.6" cy="192.0" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="338.4" cy="209.2" r="4.5" fill="#24406b" stroke="#24406b" stroke-width="2"/><circle cx="362.3" cy="234.5" r="4.5" fill="#ffffff" stroke="#24406b" stroke-width="2"/><circle cx="386.1" cy="250.8" r="4.5" fill="#ffffff" stroke="#24406b" stroke-width="2"/><circle cx="410.0" cy="288.3" r="6" fill="#c23a2b" stroke="#17211b" stroke-width="1.5"/><rect x="357.3" y="218.6" width="10" height="10" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><rect x="381.1" y="218.6" width="10" height="10" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><rect x="405.0" y="218.6" width="10" height="10" fill="#ffffff" stroke="#c23a2b" stroke-width="2.5"/><path d="M76.0 127.1L82.0 133.1L76.0 139.1L70.0 133.1Z" fill="#b3532d"/><path d="M99.9 127.1L105.9 133.1L99.9 139.1L93.9 133.1Z" fill="#b3532d"/><path d="M123.7 127.1L129.7 133.1L123.7 139.1L117.7 133.1Z" fill="#b3532d"/><path d="M147.6 208.3V298" stroke="#c23a2b" stroke-width="2.5"/><path d="M141.6 290L147.6 300L153.6 290" fill="none" stroke="#c23a2b" stroke-width="2.5"/><text x="157.6" y="265.6" class="tick">4回目 q=−0.25 m³/s（図の外）</text><circle cx="28" cy="55" r="5" fill="#24406b"/><text x="42.0" y="60.0" class="tick">fmin（白抜きは負の q）</text><rect x="22" y="71" width="12" height="12" fill="#ffffff" stroke="#b3532d" stroke-width="2.5"/><text x="42.0" y="82.0" class="tick">下限0つき Nelder–Mead</text><path d="M28 93L34 99L28 105L22 99Z" fill="#b3532d"/><text x="42.0" y="104.0" class="tick">minimize の既定（BFGS）</text><circle cx="276" cy="55" r="6" fill="#c23a2b"/><text x="290.0" y="60.0" class="tick">ツールが失敗</text><text x="20.0" y="344.0" class="tick">縦軸 q（×10⁻⁴ m³/s）、横軸 評価の番号</text><text x="20.0" y="368.0" class="tick">初期点 a=q=0.0001。SciPy 1.18.1</text></svg>
