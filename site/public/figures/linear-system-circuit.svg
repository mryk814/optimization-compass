<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">接点の電圧と電流</title><desc id="figure-description">3つの接点を一列につないだ回路。接点1に外から3 Aを流し込み、接点1と接点3は接地につながる。電圧は接点1が2.25 V、接点2が1.5 V、接点3が0.75 V。接点1と接点2の間と接点2と接点3の間をそれぞれ0.75 Aが流れ、接地へは接点1から2.25 A、接点3から0.75 A流れる。</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;fill:#17211b}.title{font-size:17px;font-weight:700}.tick{font-size:15px;fill:#56645b}.note{fill:#315c48}</style><rect width="440" height="420" rx="14" fill="#f7f8f3"/><text x="20" y="30" class="title">接点の電圧と電流</text><line x1="24" y1="160.0" x2="86" y2="160.0" stroke="#b3532d" stroke-width="3"/><polygon points="79.0,154.0 93.0,160.0 79.0,166.0" fill="#b3532d"/><text x="55.0" y="146.0" text-anchor="middle">3 A</text><line x1="132.0" y1="160.0" x2="213.0" y2="160.0" stroke="#315c48" stroke-width="3"/><polygon points="165.5,154.0 179.5,160.0 165.5,166.0" fill="#b3532d"/><line x1="257.0" y1="160.0" x2="338.0" y2="160.0" stroke="#315c48" stroke-width="3"/><polygon points="290.5,154.0 304.5,160.0 290.5,166.0" fill="#b3532d"/><text x="172.5" y="146.0" text-anchor="middle">0.75 A</text><text x="297.5" y="146.0" text-anchor="middle">0.75 A</text><line x1="110.0" y1="182.0" x2="110.0" y2="290.0" stroke="#315c48" stroke-width="3"/><polygon points="104.0,218.0 110.0,232.0 116.0,218.0" fill="#b3532d"/><text x="124.0" y="230.0">2.25 A</text><line x1="360.0" y1="182.0" x2="360.0" y2="290.0" stroke="#315c48" stroke-width="3"/><polygon points="354.0,218.0 360.0,232.0 366.0,218.0" fill="#b3532d"/><text x="374.0" y="230.0">0.75 A</text><text x="235.0" y="240.0" class="tick" text-anchor="middle">接地なし</text><line x1="70" y1="290.0" x2="400" y2="290.0" stroke="#17211b" stroke-width="3"/><text x="235.0" y="318.0" text-anchor="middle">接地（0 V）</text><circle cx="110.0" cy="160.0" r="22" fill="#e3eee6" stroke="#24406b" stroke-width="2.5"/><text x="110.0" y="166.0" text-anchor="middle">1</text><text x="110.0" y="118.0" text-anchor="middle">v₁ = 2.25 V</text><circle cx="235.0" cy="160.0" r="22" fill="#e3eee6" stroke="#24406b" stroke-width="2.5"/><text x="235.0" y="166.0" text-anchor="middle">2</text><text x="235.0" y="118.0" text-anchor="middle">v₂ = 1.5 V</text><circle cx="360.0" cy="160.0" r="22" fill="#e3eee6" stroke="#24406b" stroke-width="2.5"/><text x="360.0" y="166.0" text-anchor="middle">3</text><text x="360.0" y="118.0" text-anchor="middle">v₃ = 0.75 V</text><text x="20.0" y="364.0" class="note">どの導線も導電率 1 S。電流 = 電圧差 × 1 S</text><text x="20.0" y="388.0">接点2：流入 0.75 A、流出 0.75 A</text><text x="20.0" y="412.0">接地へ：2.25 + 0.75 = 3 A</text></svg>
