# Manual deployment pipeline for GitHub Pages.
# Trigger: workflow_dispatch only. Publication stays an explicit, human-initiated
# process (docs/pages-deployment.md); no automatic upload or deployment happens
# on push events. Validate a dataset release first, then dispatch this workflow
# from main. tier-b runs the authoritative full validation before the artifact
# is stamped, browser-checked, and deployed. If any gate fails, the previous
# validated deployment keeps serving (ADR 0014).
name: Validated Pages deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_pages_artifact:
    name: Validate and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      dataset_version: ${{ steps.identity.outputs.dataset_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies and verify action pins
        run: |
          uv lock --check
          uv sync --frozen --all-extras --all-groups
          npm --prefix site ci
          uv run --frozen python scripts/verify_workflow_pins.py
      - name: Run the authoritative validation task
        env:
          VALIDATION_TASK: tier-b
        run: uv run --frozen optimization-compass validate "$VALIDATION_TASK"
      - name: Verify generated data and repository drift
        run: |
          uv run --frozen optimization-compass export-site-data --output "$RUNNER_TEMP/site-data"
          diff --recursive --brief site/public/data "$RUNNER_TEMP/site-data"
          uv run --frozen python scripts/sync_readme_facts.py --check
          uv run --frozen python scripts/repository_size.py --check
          git diff --exit-code -- data site/public/data src/optimization_compass/resources site/package-lock.json uv.lock
      - name: Stamp and verify the exact Pages artifact
        id: identity
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          uv run --frozen python scripts/pages_artifact.py stamp \
            --root site/dist --commit-sha "$COMMIT_SHA" --base-path /optimization-compass/
          uv run --frozen python scripts/pages_artifact.py verify-local \
            --root site/dist --expected-commit-sha "$COMMIT_SHA"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "dataset_version=$(uv run --frozen python -c 'import json; print(json.load(open("site/dist/deployment.json", encoding="utf-8"))["dataset_version"])')" >> "$GITHUB_OUTPUT"
      - name: Upload the single validated Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: site/dist
          retention-days: 7

  browser_e2e:
    name: Browser E2E and accessibility
    if: github.ref == 'refs/heads/main'
    needs: validate_pages_artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: site
      - name: Download the exact artifact under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: .pages-artifact
      - name: Extract the exact artifact under test
        run: |
          rm -rf site/dist
          mkdir -p site/dist
          tar -xf .pages-artifact/artifact.tar -C site/dist
          test -f site/dist/deployment.json
      - name: Run critical journeys and axe scans
        run: |
          npm run test:e2e:critical
          npm run test:e2e:artifact -- e2e/accessibility.spec.ts --project=chromium-desktop
        working-directory: site
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            site/test-results
            site/playwright-report
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy validated artifact and smoke it
    if: github.ref == 'refs/heads/main'
    needs: [validate_pages_artifact, browser_e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the artifact uploaded by this workflow run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check out the exact deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate_pages_artifact.outputs.commit_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Smoke deployed routes, JSON assets, licenses, and identity
        run: |
          python scripts/pages_artifact.py smoke-remote \
            --base-url "${{ steps.deployment.outputs.page_url }}" \
            --expected-commit-sha "${{ needs.validate_pages_artifact.outputs.commit_sha }}" \
            --expected-dataset-version "${{ needs.validate_pages_artifact.outputs.dataset_version }}" \
            --attempts 10 \
            --delay-seconds 6 \
            --timeout-seconds 20
